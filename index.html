<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=5.0, viewport-fit=cover">
  <title>ReelVibe</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg: #08080f;
      --bg-card: rgba(255,255,255,0.03);
      --bg-hover: rgba(255,255,255,0.06);
      --bg-chip: rgba(124,58,237,0.12);
      --border: rgba(255,255,255,0.06);
      --border-hover: rgba(255,255,255,0.1);
      --border-chip: rgba(124,58,237,0.2);
      --text: rgba(255,255,255,0.92);
      --text2: rgba(255,255,255,0.55);
      --text3: rgba(255,255,255,0.3);
      --primary: #7c3aed;
      --primary-l: #a78bfa;
      --accent: #f59e0b;
      --success: #34d399;
      --error: #ef4444;
      --grad: linear-gradient(135deg, #7c3aed, #a78bfa);
      --grad-accent: linear-gradient(135deg, #7c3aed, #ec4899);
      --s1: 4px; --s2: 8px; --s3: 12px; --s4: 16px; --s5: 20px;
      --s6: 24px; --s8: 32px; --s10: 40px; --s12: 48px;
      --f-xs: 11px; --f-sm: 12px; --f-md: 13px; --f-base: 14px;
      --f-lg: 16px; --f-xl: 18px; --f-2xl: 20px; --f-3xl: 24px; --f-4xl: 28px;
      --r-sm: 8px; --r-md: 14px; --r-lg: 20px; --r-xl: 24px;
      --spring: cubic-bezier(0.34, 1.56, 0.64, 1);
      --ease-out: cubic-bezier(0.16, 1, 0.3, 1);
    }
    @media (prefers-reduced-motion: reduce) { *,::before,::after { animation-duration:0.01ms!important; transition-duration:0.01ms!important; } }
    *,::before,::after { box-sizing:border-box; margin:0; padding:0; }
    html,body {
      height:100%; overflow:hidden;
      font-family:'Inter',-apple-system,BlinkMacSystemFont,sans-serif;
      background:var(--bg); color:var(--text);
      -webkit-font-smoothing:antialiased;
    }
    .bg-amb {
      position:fixed; inset:0; z-index:0;
      background: radial-gradient(ellipse 70% 50% at 15% 25%, rgba(124,58,237,0.08) 0%, transparent 70%), radial-gradient(ellipse 50% 40% at 85% 75%, rgba(167,139,250,0.06) 0%, transparent 60%), radial-gradient(ellipse 40% 35% at 50% 50%, rgba(236,72,153,0.04) 0%, transparent 50%);
      animation: amb 25s ease-in-out infinite alternate;
    }
    @keyframes amb { 0%{transform:scale(1)} 100%{transform:scale(1.08)rotate(2deg)} }
    .bg-amb::after { content:''; position:fixed; inset:0; opacity:0.02; background-image:url("data:image/svg+xml,%3Csvg viewBox='0 0 256 256' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.9' numOctaves='4'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)'/%3E%3C/svg%3E"); pointer-events:none; }
    #app { position:relative; z-index:1; height:100dvh; max-width:480px; margin:0 auto; display:flex; flex-direction:column; padding:0 var(--s5); }
    .hd { padding: var(--s10) 0 var(--s2); flex-shrink:0; display:flex; align-items:center; justify-content:space-between; }
    .hd-brand { display:flex; align-items:center; gap:var(--s3); font-size:var(--f-xl); font-weight:800; letter-spacing:-0.3px; }
    .hd-brand svg { width:28px; height:28px; }
    .hd-step { font-size:var(--f-md); font-weight:500; color:var(--text3); letter-spacing:0.3px; }
    .hd-step span { color:var(--primary-l); }
    .pr { padding:0 0 var(--s6); flex-shrink:0; }
    .pr-track { height:4px; background:var(--bg-card); border-radius:4px; overflow:hidden; }
    .pr-fill { height:100%; border-radius:4px; width:0%; background:var(--grad); transition:width 0.6s var(--spring); position:relative; }
    .pr-fill::after { content:''; position:absolute; right:-3px; top:-2px; width:8px; height:8px; border-radius:50%; background:var(--primary); opacity:0.5; filter:blur(4px); }
    .sl { flex:1; position:relative; overflow:hidden; margin:0 calc(-1*var(--s2)); padding:0 var(--s2); }
    .slide { position:absolute; inset:0; display:flex; flex-direction:column; justify-content:center; opacity:0; transform:translateY(20px) scale(0.97); transition:opacity 0.45s var(--ease-out), transform 0.5s var(--spring); pointer-events:none; }
    .slide.active { opacity:1; transform:translateY(0) scale(1); pointer-events:auto; }
    .slide.dismiss { opacity:0; transform:translateY(-16px) scale(0.95); }
    .slide-r { justify-content:flex-start; }
    .q-num { font-size:var(--f-sm); font-weight:600; color:var(--primary-l); letter-spacing:1.5px; text-transform:uppercase; margin-bottom:var(--s1); }
    .q-title { font-size:var(--f-4xl); font-weight:800; line-height:1.1; letter-spacing:-0.5px; margin-bottom:var(--s1); }
    .q-sub { font-size:var(--f-base); color:var(--text2); margin-bottom:var(--s6); font-weight:400; }
    .q-sub a { color:var(--primary-l); cursor:pointer; text-decoration:underline; }
    /* Options */
    .opts { display:grid; gap:var(--s3); }
    .opts-2 { grid-template-columns:1fr 1fr; }
    .opts-3 { grid-template-columns:1fr 1fr 1fr; }
    .opts-4 { grid-template-columns:1fr 1fr; }
    .opt { background:var(--bg-card); border:1px solid var(--border); border-radius:var(--r-md); padding:var(--s5) var(--s3); text-align:center; cursor:pointer; transition:all 0.25s var(--spring); display:flex; flex-direction:column; align-items:center; gap:var(--s2); position:relative; overflow:hidden; min-height:80px; -webkit-tap-highlight-color:transparent; outline:none; }
    .opt:focus-visible { box-shadow:0 0 0 2px var(--primary); }
    .opt:hover { background:var(--bg-hover); border-color:var(--border-hover); }
    .opt:active { transform:scale(0.96); }
    .opt svg { width:28px; height:28px; color:var(--text2); transition:color 0.25s ease; }
    .opt .lbl { font-size:var(--f-md); font-weight:500; color:var(--text2); line-height:1.2; }
    .opt.selected { border-color:var(--border-chip); background:var(--bg-chip); box-shadow:0 0 30px rgba(124,58,237,0.08); }
    .opt.selected svg { color:var(--primary-l); }
    .opt.selected .lbl { color:var(--text); }
    .opt.selected::after { content:''; position:absolute; top:-1px; left:25%; right:25%; height:2px; background:var(--grad); border-radius:2px; }
    /* Multi-select chip */
    .chip-grid { display:flex; flex-wrap:wrap; gap:var(--s2); justify-content:center; }
    .chip { display:inline-flex; align-items:center; gap:var(--s1); padding:var(--s2) var(--s4); border-radius:100px; background:var(--bg-card); border:1px solid var(--border); cursor:pointer; transition:all 0.2s var(--spring); font-size:var(--f-md); font-weight:500; color:var(--text2); -webkit-tap-highlight-color:transparent; }
    .chip:active { transform:scale(0.94); }
    .chip svg { width:16px; height:16px; color:var(--text3); }
    .chip.selected { background:var(--bg-chip); border-color:var(--border-chip); color:var(--primary-l); }
    .chip.selected svg { color:var(--primary-l); }
    .chip .check { display:none; }
    .chip.selected .check { display:inline; }
    .chip.selected .plus { display:none; }
    /* Full width opt */
    .opt-fw { background:var(--bg-card); border:1px solid var(--border); border-radius:var(--r-md); padding:var(--s5); text-align:center; cursor:pointer; transition:all 0.25s var(--spring); display:flex; align-items:center; justify-content:center; gap:var(--s3); min-height:56px; -webkit-tap-highlight-color:transparent; }
    .opt-fw:focus-visible { box-shadow:0 0 0 2px var(--primary); }
    .opt-fw:hover { background:var(--bg-hover); border-color:var(--border-hover); }
    .opt-fw:active { transform:scale(0.97); }
    .opt-fw svg { width:24px; height:24px; color:var(--text2); }
    .opt-fw .lbl { font-size:var(--f-lg); font-weight:500; color:var(--text2); }
    .opt-fw.selected { border-color:var(--border-chip); background:var(--bg-chip); box-shadow:0 0 30px rgba(124,58,237,0.08); }
    .opt-fw.selected svg { color:var(--primary-l); }
    .opt-fw.selected .lbl { color:var(--text); }
    .nv { padding:var(--s4) 0 var(--s8); flex-shrink:0; }
    .btn-pri { width:100%; padding:var(--s5); border:none; border-radius:var(--r-md); font-size:var(--f-lg); font-weight:600; font-family:inherit; background:var(--grad); color:#fff; cursor:pointer; transition:all 0.25s var(--spring); opacity:0.2; pointer-events:none; }
    .btn-pri.enabled { opacity:1; pointer-events:auto; }
    .btn-pri.enabled:hover { transform:translateY(-1px); box-shadow:0 12px 32px rgba(124,58,237,0.25); }
    .btn-pri:active { transform:scale(0.97); }
    .btn-pri svg { width:18px; height:18px; display:inline-block; vertical-align:middle; margin-right:6px; }
    .hint { text-align:center; margin-top:var(--s2); font-size:var(--f-sm); color:var(--text3); }
    /* Results */
    .rv { flex:1; display:flex; flex-direction:column; padding-top:var(--s1); min-height:0; }
    .rv-head { display:flex; align-items:flex-start; gap:var(--s2); margin-bottom:var(--s4); flex-shrink:0; flex-direction:column; }
    .rv-head h2 { font-size:var(--f-3xl); font-weight:800; letter-spacing:-0.3px; }
    .rv-head .sub { font-size:var(--f-base); color:var(--text2); }
    .rv-scroll { flex:1; overflow-y:auto; -webkit-overflow-scrolling:touch; padding:0 var(--s1) var(--s3); min-height:0; }
    .rv-scroll::-webkit-scrollbar { width:3px; }
    .rv-scroll::-webkit-scrollbar-thumb { background:var(--bg-hover); border-radius:3px; }
    /* Taste Profile */
    .taste { display:flex; flex-wrap:wrap; gap:var(--s1); padding:var(--s3) var(--s4); background:var(--bg-card); border:1px solid var(--border); border-radius:var(--r-md); margin-bottom:var(--s4); }
    .taste-pill { font-size:var(--f-xs); font-weight:500; padding:3px var(--s2); border-radius:100px; background:var(--bg-chip); color:var(--primary-l); border:1px solid var(--border-chip); }
    /* Card */
    .rc { background:var(--bg-card); border:1px solid var(--border); border-radius:var(--r-lg); padding:var(--s5); margin-bottom:var(--s3); position:relative; overflow:hidden; cursor:pointer; transition:all 0.15s ease; -webkit-tap-highlight-color:transparent; }
    .rc:active { transform:scale(0.98); }
    .rc::before { content:''; position:absolute; top:0; left:0; right:0; height:3px; background:var(--grad-accent); opacity:0.5; }
    .rc .rank { display:flex; align-items:center; gap:var(--s1); font-size:var(--f-sm); font-weight:600; color:var(--primary-l); text-transform:uppercase; letter-spacing:1px; margin-bottom:var(--s1); }
    .rc .rank .star { color:var(--accent); font-size:var(--f-lg); }
    .rc .title { font-size:var(--f-2xl); font-weight:700; letter-spacing:-0.2px; margin-bottom:var(--s1); }
    .rc .meta { display:flex; align-items:center; gap:var(--s2); font-size:var(--f-md); color:var(--text2); margin-bottom:var(--s3); flex-wrap:wrap; }
    .rc .meta .dot { width:3px; height:3px; border-radius:50%; background:var(--text3); flex-shrink:0; }
    .rc .match-badge { display:inline-flex; align-items:center; gap:3px; font-size:var(--f-xs); font-weight:600; color:var(--success); background:rgba(52,211,153,0.08); padding:2px var(--s2); border-radius:20px; border:1px solid rgba(52,211,153,0.12); }
    .rc .match-badge svg { width:12px; height:12px; }
    .rc .tags { display:flex; flex-wrap:wrap; gap:var(--s1); margin-bottom:var(--s3); }
    .rc .tag { font-size:var(--f-xs); font-weight:500; padding:3px var(--s2); border-radius:20px; background:var(--bg-card); border:1px solid var(--border); color:var(--text2); }
    .rc .desc { font-size:var(--f-base); color:var(--text2); line-height:1.5; margin-bottom:var(--s2); }
    .rc .act { display:flex; gap:var(--s2); }
    .rc .act button { padding:var(--s2) var(--s4); border:none; border-radius:var(--r-sm); font-size:var(--f-sm); font-weight:600; font-family:inherit; cursor:pointer; transition:all 0.15s ease; min-height:36px; display:flex; align-items:center; gap:var(--s1); }
    .rc .act button:active { transform:scale(0.95); }
    .rc .act button svg { width:14px; height:14px; display:inline-block; vertical-align:middle; margin-right:4px; }
    .btn-wl { background:rgba(124,58,237,0.12); color:var(--primary-l); border:1px solid rgba(124,58,237,0.15); }
    .btn-wl.saved { background:rgba(52,211,153,0.12); color:var(--success); border-color:rgba(52,211,153,0.15); }
    .btn-wt { background:var(--bg-card); color:var(--text2); border:1px solid var(--border); }
    .btn-wt.seen { background:rgba(245,158,11,0.12); color:var(--accent); }
    .rc .exp { max-height:0; overflow:hidden; transition:max-height 0.35s var(--spring); }
    .rc.expanded .exp { max-height:200px; }
    .exp-in { padding-top:var(--s3); border-top:1px solid var(--border); margin-top:var(--s4); display:grid; grid-template-columns:1fr 1fr; gap:var(--s2); }
    .exp-in .row { display:flex; flex-direction:column; gap:2px; }
    .exp-in .row .lbl { font-size:var(--f-xs); color:var(--text3); text-transform:uppercase; letter-spacing:0.5px; }
    .exp-in .row .val { font-size:var(--f-base); color:var(--text2); font-weight:500; }
    .rbar { display:flex; gap:var(--s2); flex-shrink:0; padding:var(--s2) 0 var(--s5); }
    .rbar button { flex:1; padding:var(--s3) var(--s4); border:none; border-radius:var(--r-md); font-size:var(--f-md); font-weight:600; font-family:inherit; cursor:pointer; transition:all 0.15s ease; min-height:48px; display:inline-flex; align-items:center; justify-content:center; gap:6px; }
    .rbar button:active { transform:scale(0.96); }
    .rbar button svg { width:16px; height:16px; display:inline-block; vertical-align:middle; }
    .btn-ref { background:var(--bg-card); color:var(--text2); border:1px solid var(--border); }
    .btn-r { background:var(--grad); color:#fff; }
    .btn-sh { background:var(--bg-card); color:var(--text); border:1px solid var(--border); }
    .load { display:flex; flex-direction:column; align-items:center; justify-content:center; gap:var(--s5); height:100%; }
    .load-r { width:40px; height:40px; border:3px solid var(--border); border-top-color:var(--primary); border-radius:50%; animation:spin 0.7s linear infinite; }
    @keyframes spin { to{transform:rotate(360deg)} }
    .load p { font-size:var(--f-base); color:var(--text3); }
    .toast { position:fixed; bottom:32px; left:50%; transform:translateX(-50%) translateY(80px); background:rgba(255,255,255,0.07); backdrop-filter:blur(20px); border:1px solid var(--border); border-radius:var(--r-md); padding:var(--s3) var(--s6); font-size:var(--f-base); font-weight:500; color:var(--text); opacity:0; transition:all 0.4s var(--spring); z-index:100; pointer-events:none; white-space:nowrap; }
    .toast.show { opacity:1; transform:translateX(-50%) translateY(0); }
    .mo { position:fixed; inset:0; z-index:50; background:rgba(0,0,0,0.6); backdrop-filter:blur(12px); display:flex; align-items:flex-end; opacity:0; pointer-events:none; transition:opacity 0.25s ease; }
    .mo.open { opacity:1; pointer-events:auto; }
    .modal { width:100%; max-width:480px; margin:0 auto; background:#11111d; border-radius:var(--r-xl) var(--r-xl) 0 0; padding:var(--s5) var(--s5) var(--s10); max-height:70vh; overflow-y:auto; transform:translateY(100%); border-top:1px solid var(--border); transition:transform 0.4s var(--spring); }
    .mo.open .modal { transform:translateY(0); }
    .mh { width:36px; height:4px; background:var(--text3); border-radius:4px; margin:0 auto var(--s4); opacity:0.3; }
    .modal h3 { font-size:var(--f-2xl); font-weight:700; margin-bottom:var(--s1); }
    .modal .sub { font-size:var(--f-md); color:var(--text2); margin-bottom:var(--s5); }
    .mi { display:flex; align-items:center; justify-content:space-between; padding:var(--s4); background:var(--bg-card); border-radius:var(--r-md); margin-bottom:var(--s2); border:1px solid var(--border); }
    .mi .t { font-weight:600; font-size:var(--f-lg); }
    .mi .m { font-size:var(--f-sm); color:var(--text2); }
    .mi button { background:rgba(239,68,68,0.1); border:none; color:var(--error); padding:var(--s2) var(--s4); border-radius:var(--r-sm); font-size:var(--f-sm); font-weight:600; cursor:pointer; font-family:inherit; min-height:36px; }
    .empty { text-align:center; padding:var(--s10) 0; color:var(--text3); font-size:var(--f-base); }
    .empty svg { width:40px; height:40px; margin-bottom:var(--s3); opacity:0.3; }
    @keyframes fadeUp { from{opacity:0;transform:translateY(10px)} to{opacity:1;transform:translateY(0)} }
    .anim-in { animation:fadeUp 0.45s var(--ease-out) forwards; opacity:0; }
    .d1 { animation-delay:0.1s; } .d2 { animation-delay:0.18s; } .d3 { animation-delay:0.26s; } .d4 { animation-delay:0.34s; } .d5 { animation-delay:0.42s; }
    @media(max-width:380px){ #app{padding:0 var(--s4)} .q-title{font-size:var(--f-3xl)} .opt svg{width:24px;height:24px} .opt .lbl{font-size:var(--f-sm)} .opt{padding:var(--s4) var(--s2);min-height:72px} .hd{padding-top:var(--s10)} }
    @media(min-width:481px){ #app{border-left:1px solid var(--border);border-right:1px solid var(--border)} }
  </style>
</head>
<body>
<div class="bg-amb"></div>
<div id="app">
  <div class="hd">
    <div class="hd-brand">
      <svg viewBox="0 0 28 28" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="2" y="2" width="20" height="20" rx="4"/><path d="M16 14l-6 4V10l6 4z"/><path d="M22 10l4-2v12l-4-2"/></svg>
      ReelVibe
    </div>
    <div class="hd-step" id="hdSt"><span>1</span>/5</div>
  </div>
  <div class="pr"><div class="pr-track"><div class="pr-fill" id="prF"></div></div></div>
  <div class="sl" id="slW"></div>
  <div class="nv">
    <button class="btn-pri" id="btnN">Next <span class="arrow">→</span></button>
    <div class="hint" id="hint">Tap an option to continue</div>
  </div>
</div>
<div class="toast" id="tst"></div>
<div class="mo" id="wlM"><div class="modal" onclick="event.stopPropagation()"><div class="mh"></div><h3>Watchlist</h3><div class="sub" id="wlC">0 saved</div><div id="wlL"></div></div></div>

<script>
// ━━━━━━━━ ICONS ━━━━━━━━
const I = {
  pumped:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M8.5 14.5A2.5 2.5 0 0011 12c0-1.38-.5-2-1-3-1.072-2.143-.224-4.054 2-6 .5 2.5 2 4.9 4 6.5 2 1.6 3 3.5 3 5.5a7 7 0 11-14 0c0-1.153.433-2.294 1-3a2.5 2.5 0 002.5 2.5z"/></svg>',
  thoughtful:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="10"/><path d="M9 10h.01M15 10h.01M9.05 15.5A5.5 5.5 0 0015 15"/></svg>',
  funny:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="10"/><path d="M8 14s1.5 2 4 2 4-2 4-2"/><line x1="9" y1="9" x2="9.01" y2="9"/><line x1="15" y1="9" x2="15.01" y2="9"/></svg>',
  tense:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="10"/><path d="M12 8v4M12 16h.01"/></svg>',
  emotional:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M20.84 4.61a5.5 5.5 0 00-7.78 0L12 5.67l-1.06-1.06a5.5 5.5 0 00-7.78 7.78l1.06 1.06L12 21.23l7.78-7.78 1.06-1.06a5.5 5.5 0 000-7.78z"/></svg>',
  chill:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 3a6 6 0 006 6 6 6 0 01-6 6 6 6 0 016 6 6 6 0 01-6-6 6 6 0 01-6-6 6 6 0 016-6z"/></svg>',
  // Genres
  'sci-fi':'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="10"/><path d="M12 6v12M6 12h12"/></svg>',

// ━━━━━━━━ STATE ━━━━━━━━
let cur = 0;
const ans = {};
let wl = JSON.parse(localStorage.getItem('rv_wl')||'[]');
let wt = JSON.parse(localStorage.getItem('rv_wt')||'[]');

const $ = id=>document.getElementById(id);
const slW = $('slW'), btn = $('btnN'), prF = $('prF'), hdSt = $('hdSt'), tst = $('tst'), hint = $('hint');

// ━━━━━━━━ RENDER ━━━━━━━━
function render() {
  slW.innerHTML = Q.map((q,i)=>`
    <div class="slide ${i===0?'active':''}">
      <div class="q-num">${q.num}. ${q.id}</div>
      <div class="q-title">${q.title}</div>
      <div class="q-sub">${q.sub}</div>
      ${q.multi ? `<div class="chip-grid" data-q="${q.id}">${q.opts.map(o=>`
        <div class="chip" data-q="${q.id}" data-val="${o.i}">
          <span class="plus">${I.plus}</span><span class="check">${I.check}</span>
          ${o.l}
        </div>
      `).join('')}</div>` :
      `<div class="opts opts-${q.cols}" role="radiogroup" aria-label="${q.id}">${q.opts.map(o=>`
        <div class="${q.cols===1?'opt-fw':'opt'}" data-q="${q.id}" data-val="${o.i}" role="radio" tabindex="0" aria-label="${o.l}">
          ${I[o.i]||''}
          <span class="lbl">${o.l}</span>
        </div>
      `).join('')}</div>`}
    </div>
  `).join('');
  updUI();
}

function updUI() {
  const t = Q.length;
  prF.style.width = Math.round((cur/t)*100)+'%';
  hdSt.innerHTML = `<span>${Math.min(cur+1,t)}</span>/${t}`;
  if (cur < t) {
    const last = cur === t-1;
    btn.innerHTML = last ? 'Get My Picks <span class="arrow">→</span>' : 'Next <span class="arrow">→</span>';
    const q = Q[cur];
    if (q.multi) {
      const selected = ans[q.id]||[];
      btn.classList.toggle('enabled', selected.length > 0);
    } else {
      btn.classList.toggle('enabled', !!ans[q.id]);
    }
    hint.textContent = cur===0 ? 'Tap to begin' : q.multi ? 'Pick one or more' : 'Tap to continue';
  }
}

// ━━━━━━━━ NAV ━━━━━━━━
function goTo(n) {
  const slides = slW.querySelectorAll('.slide');
  slides.forEach(s=>{s.classList.remove('active','dismiss')});
  if (n > cur) slides[cur]?.classList.add('dismiss');
  slides[n]?.classList.add('active');
  cur = n; updUI(); bindNav();
}

function bindNav() {
  btn.onclick = ()=>{
    if (!btn.classList.contains('enabled')) return;
    if (cur < Q.length-1) goTo(cur+1);
    else compute();
  };
}

// ━━━━━━━━ SELECTION ━━━━━━━━
slW.addEventListener('click', e => {
  // Multi-select chips
  const chip = e.target.closest('.chip');
  if (chip) {
    const qId = chip.dataset.q;
    const val = chip.dataset.val;
    if (!qId) return;
    ans[qId] = ans[qId]||[];
    const idx = ans[qId].indexOf(val);
    chip.classList.toggle('selected');
    if (idx > -1) ans[qId].splice(idx,1);
    else ans[qId].push(val);
    updUI();
    return;
  }
  // Single select
  const el = e.target.closest('.opt, .opt-fw');
  if (!el) return;
  const qId = el.dataset.q, val = el.dataset.val;
  if (!qId) return;
  el.closest('.slide').querySelectorAll('.opt, .opt-fw').forEach(x=>x.classList.remove('selected'));
  el.classList.add('selected');
  ans[qId] = val;
  btn.classList.add('enabled');
});
slW.addEventListener('keydown', e => {
  if (e.key==='Enter'||e.key===' ') { const el=e.target.closest('.opt,.opt-fw,.chip'); if(el){e.preventDefault();el.click();} }
});

// ━━━━━━━━ ENGINE ━━━━━━━━
function score(item) {
  let s = 0;
  // Mood match (35pts)
  if (item.m.includes(ans.mood)) s += 35;
  // Genre match (20pts each, max 60)
  const genres = Array.isArray(ans.genre) ? ans.genre : [ans.genre].filter(Boolean);
  let gScore = 0;
  for (const g of genres) {
    if (item.g.includes(g)) gScore += 20;
  }
  s += Math.min(gScore, 60);
  // Type match (15pts)
  if (ans.type === 'either') s += 8;
  else if (item.ty === ans.type) s += 15;
  // Energy match (10pts)
  if (item.e === ans.energy) s += 10;
  else if (ans.energy === 'medium' && (item.e==='light'||item.e==='heavy')) s += 4;
  // Era match (10pts)
  if (!ans.era || ans.era === 'any') s += 10;
  else if (item.er === ans.era) s += 10;
  else if ((ans.era==='pre2000'||ans.era==='era2000s') && (item.er==='pre2000'||item.er==='era2000s')) s += 6;
  else if ((ans.era==='era2020s') && (item.er==='era2020s'||item.er==='latest')) s += 6;
  else if ((ans.era==='latest') && item.er==='latest') s += 8;
  // IMDb boost (up to 8pts)
  s += Math.round((item.rt / 10) * 8);
  // Combo bonuses
  if (ans.mood==='tense' && item.g.includes('dark')) s += 5;
  if (ans.mood==='chill' && item.g.includes('comedy')) s += 5;
  if (ans.mood==='pumped' && item.g.includes('action')) s += 5;
  return s;
}

function recommend() {
  const sc = DB.map(d=>({...d,s:score(d)}));
  sc.sort((a,b)=>b.s - a.s);
  const seen=new Set(), top=[];
  for (const i of sc) {
    const k=i.t.toLowerCase().replace(/[^a-z0-9]/g,'');
    if (!seen.has(k)&&!wt.includes(k)) { seen.add(k); top.push(i); }
    if (top.length>=7) break;
  }
  return top;
}

// ━━━━━━━━ RESULTS ━━━━━━━━
function compute() {
  slW.innerHTML = `<div class="slide active slide-r"><div class="load"><div class="load-r"></div><p>Analyzing your taste...</p></div></div>`;
  btn.classList.remove('enabled'); btn.textContent = '⋯';
  setTimeout(()=>show(recommend()), 600);
}

function show(picks, ref) {
  const maxS = Math.max(...picks.map(p=>p.s),1);
  // Build taste profile
  const tastePills = [];
  if (ans.mood) tastePills.push(`🎭 ${ans.mood}`);
  const genres = Array.isArray(ans.genre) ? ans.genre : [ans.genre].filter(Boolean);
  genres.forEach(g => tastePills.push(`🏷️ ${g}`));
  if (ans.energy) tastePills.push(`⚡ ${ans.energy}`);
  if (ans.era) tastePills.push(`📅 ${ans.era}`);
  const eraNames = {pre2000:'pre-2000',era2000s:'2000s',era2010s:'2010s',era2020s:'2020s',latest:'2024+',any:'Any'};

  slW.innerHTML = `<div class="slide active slide-r"><div class="rv">
    <div class="rv-head">
      <h2>${ref?'Refreshed':'Your Picks'}</h2>
      <div class="sub">${ref?'Here\'s a different take':`We found your top ${picks.length}`}</div>
    </div>
    <div class="taste">${tastePills.map(p=>`<span class="taste-pill">${p}</span>`).join('')}</div>
    <div class="rv-scroll">
      ${picks.map((item,i)=>{
        const pct = Math.round((item.s/maxS)*100);
        const k = item.t.toLowerCase().replace(/[^a-z0-9]/g,'');
        const w = wl.includes(k);
        const badge = i===0 ? '⭐ ' : ['🥇','🥈','🥉','4️⃣','5️⃣','6️⃣','7️⃣'][i]+' ';
        const rankL = i===0 ? ['#1 Pick','Star Pick'][0] : ['#2','#3','#4','#5','#6','#7'][i-1];
        const iLbl = {light:'🌿 Light',medium:'⚡ Medium',heavy:'🌋 Heavy'}[item.e]||item.e;
        return `<div class="rc anim-in d${Math.min(i+1,5)}" data-key="${k}" onclick="this.classList.toggle('expanded')" tabindex="0" role="button" aria-label="${item.t}">
          <div class="rank">${badge} ${rankL}</div>
          <div class="title">${item.t}</div>
          <div class="meta">
            <span>${item.y}</span><span class="dot"></span>
            <span>${item.ty==='movie'?'🎬 Movie':'📺 Series'}</span><span class="dot"></span>
            <span>${iLbl}</span>
            <span class="match-badge">${I.check} ${pct}%</span>
          </div>
          <div class="tags">${item.g.map(g=>`<span class="tag">#${g}</span>`).join('')}
          ${item.rt?`<span class="tag">★ ${item.rt}</span>`:''}</div>
          <div class="desc">${item.d}</div>
          <div class="act">
            <button class="btn-wl ${w?'saved':''}" onclick="event.stopPropagation();tglWl('${k}','${item.t.replace(/'/g,"\\'")}',this)">${w?I.check:I.bookmark} ${w?'Saved':'Watchlist'}</button>
            <button class="btn-wt ${wt.includes(k)?'seen':''}" onclick="event.stopPropagation();tglWt('${k}',this)">${I.eye} ${wt.includes(k)?'Seen':'Watched'}</button>
          </div>
          <div class="exp"><div class="exp-in">
            <div class="row"><span class="lbl">Year</span><span class="val">${item.y}</span></div>
            <div class="row"><span class="lbl">Rating</span><span class="val">★ ${item.rt}/10</span></div>
            <div class="row"><span class="lbl">Type</span><span class="val">${item.ty==='movie'?'🎬 Movie':'📺 Series'}</span></div>
            <div class="row"><span class="lbl">Energy</span><span class="val">${iLbl}</span></div>
            <div class="row"><span class="lbl">Content</span><span class="val">${item.cn==='none'?'🌿 Clean':item.cn==='mild'?'⚡ Mild':item.cn==='moderate'?'⚠️ Moderate':'🔞 Heavy'}</span></div>
            <div class="row"><span class="lbl">Streaming</span><span class="val">${(item.pl||['Various']).join(', ')}</span></div>
          </div></div>
        </div>`;
      }).join('')}
    </div>
    <div class="rbar">
      <button class="btn-ref" onclick="refine()">${I.refresh} Refresh</button>
      <button class="btn-sh" onclick="share()">${I.share} Share</button>
      <button class="btn-sh" onclick="openWL()">${I.list} Watchlist</button>
      <button class="btn-r" onclick="retake()">Retake</button>
    </div>
  </div></div>`;
  prF.style.width='100%';
  hdSt.innerHTML = '✨ Done';
  btn.classList.remove('enabled');
  btn.innerHTML = 'Back to top';
  btn.onclick = ()=>{ document.querySelector('.rv-scroll')?.scrollTo({ top: 0, behavior: 'smooth' }); };
}

function refine() {
  slW.innerHTML = `<div class="slide active slide-r"><div class="load"><div class="load-r"></div><p>Finding something different...</p></div></div>`;
  setTimeout(()=>{
    const p = recommend();
    if (p.length>3) {
      const rest = DB.filter(d=>!p.some(x=>x.t===d.t));
      if (rest.length>2) {
        const r1 = rest[Math.floor(Math.random()*rest.length)];
        const r2 = rest[Math.floor(Math.random()*rest.length)];
        if (r1 && r2 && r1.t !== r2.t) { p[p.length-1]={...r1,s:score(r1)}; p[p.length-2]={...r2,s:score(r2)}; }
      }
    }
    p.sort((a,b)=>b.s-a.s);
    show(p.slice(0,7), true);
  },500);
}

// ━━━━━━━━ WATCHLIST ━━━━━━━━
function tglWl(key,title,el) {
  const i=wl.indexOf(key);
  if(i>-1){wl.splice(i,1);if(el){el.innerHTML=`${I.bookmark} Watchlist`;el.classList.remove('saved');}showToast('Removed');}
  else{wl.push(key);if(el){el.innerHTML=`${I.check} Saved`;el.classList.add('saved');}showToast('Added ✨');}
  localStorage.setItem('rv_wl',JSON.stringify(wl));
}
function tglWt(key,el) {
  const i=wt.indexOf(key);
  if(i>-1){wt.splice(i,1);if(el){el.innerHTML=`${I.eye} Watched`;el.classList.remove('seen');}showToast('Unmarked');}
  else{wt.push(key);if(el){el.innerHTML=`${I.check} Seen`;el.classList.add('seen');}showToast('Marked as watched 👁️');
    const wi=wl.indexOf(key);if(wi>-1){wl.splice(wi,1);localStorage.setItem('rv_wl',JSON.stringify(wl));}}
  localStorage.setItem('rv_wt',JSON.stringify(wt));
}
function openWL() {
  const ov=$('wlM'), list=$('wlL'), cnt=$('wlC');
  cnt.textContent=`${wl.length} saved`;
  if(!wl.length){list.innerHTML=`<div class="empty"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><path d="M19 21l-7-5-7 5V5a2 2 0 012-2h10a2 2 0 012 2v16z"/></svg><br>Nothing saved yet</div>`;}
  else{list.innerHTML=wl.map(k=>{const item=DB.find(d=>d.t.toLowerCase().replace(/[^a-z0-9]/g,'')===k);return item?`<div class="mi"><div><div class="t">${item.t}</div><div class="m">${item.y} · ${item.ty==='movie'?'🎬 Movie':'📺 Series'}</div></div><button onclick="rmWL('${k}')">Remove</button></div>`:'';}).join('');}
  ov.classList.add('open');
}
function rmWL(key){const i=wl.indexOf(key);if(i>-1){wl.splice(i,1);localStorage.setItem('rv_wl',JSON.stringify(wl));openWL();showToast('Removed');}}
$('wlM').addEventListener('click',e=>{if(e.target===e.currentTarget)e.currentTarget.classList.remove('open')});

// ━━━━━━━━ SHARE ━━━━━━━━
function share() {
  const titles = [...document.querySelectorAll('.rc .title')].map(el=>el.textContent);
  if(!titles.length) return;
  const text = `My ReelVibe picks:\n\n${titles.map((t,i)=>['⭐','🥇','🥈','🥉','4️⃣','5️⃣','6️⃣'][i]+' '+t).join('\n')}\n\nreelvibe.app`;
  if(navigator.share){navigator.share({title:'ReelVibe',text}).catch(()=>{});}
  else{navigator.clipboard.writeText(text).then(()=>showToast('Copied!')).catch(()=>{});}
}

// ━━━━━━━━ RETAKE ━━━━━━━━
function retake() {
  Object.keys(ans).forEach(k=>delete ans[k]);
  cur=0; render(); bindNav();
  btn.innerHTML='Next <span class="arrow">→</span>';
  btn.classList.remove('enabled');
  prF.style.width='0%';
  hdSt.innerHTML='<span>1</span>/5';
  hint.textContent='Tap to begin';
  btn.onclick=null; bindNav();
}

// ━━━━━━━━ TOAST ━━━━━━━━
let tt;
function showToast(m){tst.textContent=m;tst.classList.add('show');clearTimeout(tt);tt=setTimeout(()=>tst.classList.remove('show'),2000);}

// ━━━━━━━━ BOOT ━━━━━━━━
render(); bindNav();
</script>
