<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=5.0, viewport-fit=cover">
  <title>ReelVibe</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;450;500;550;600;700;800;900&display=swap" rel="stylesheet">
  <style>
    /* ── Design Tokens (UI-UX Pro Max compliant) ── */
    :root {
      --bg: #0c0c14;
      --bg-elevated: rgba(255,255,255,0.04);
      --bg-hover: rgba(255,255,255,0.06);
      --bg-selected: rgba(124,58,237,0.12);
      --surface: rgba(255,255,255,0.03);
      --surface-elevated: rgba(255,255,255,0.05);
      --border: rgba(255,255,255,0.06);
      --border-hover: rgba(255,255,255,0.1);
      --border-selected: #7c3aed;
      --text: rgba(255,255,255,0.92);
      --text-secondary: rgba(255,255,255,0.55);
      --text-tertiary: rgba(255,255,255,0.3);
      --primary: #7c3aed;
      --primary-light: #a78bfa;
      --accent: #f59e0b;
      --success: #34d399;
      --error: #ef4444;
      --gradient: linear-gradient(135deg, #7c3aed, #a78bfa);
      --gradient-accent: linear-gradient(135deg, #7c3aed, #ec4899);
      --shadow: 0 8px 32px rgba(0,0,0,0.3);
      --radius-sm: 8px;
      --radius-md: 14px;
      --radius-lg: 20px;
      --radius-xl: 24px;
      --space-1: 4px;
      --space-2: 8px;
      --space-3: 12px;
      --space-4: 16px;
      --space-5: 20px;
      --space-6: 24px;
      --space-8: 32px;
      --space-10: 40px;
      --space-12: 48px;
      --font-xs: 11px;
      --font-sm: 12px;
      --font-md: 13px;
      --font-base: 14px;
      --font-lg: 16px;
      --font-xl: 18px;
      --font-2xl: 20px;
      --font-3xl: 24px;
      --font-4xl: 28px;
      --ease-spring: cubic-bezier(0.34, 1.56, 0.64, 1);
      --ease-out: cubic-bezier(0.16, 1, 0.3, 1);
      --ease-in: cubic-bezier(0.4, 0, 1, 1);
      --duration-fast: 150ms;
      --duration-normal: 250ms;
      --duration-slow: 400ms;
    }

    /* ── Reset ── */
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    html, body {
      height: 100%; overflow: hidden;
      font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
      background: var(--bg);
      color: var(--text);
      -webkit-font-smoothing: antialiased;
      -moz-osx-font-smoothing: grayscale;
    }

    /* ── Reduced Motion ── */
    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after {
        animation-duration: 0.01ms !important;
        animation-iteration-count: 1 !important;
        transition-duration: 0.01ms !important;
      }
    }

    /* ── Animated BG ── */
    .bg-ambient {
      position: fixed; inset: 0; z-index: 0;
      background:
        radial-gradient(ellipse 70% 50% at 15% 25%, rgba(124,58,237,0.08) 0%, transparent 70%),
        radial-gradient(ellipse 50% 40% at 85% 75%, rgba(167,139,250,0.06) 0%, transparent 60%),
        radial-gradient(ellipse 40% 35% at 50% 50%, rgba(236,72,153,0.04) 0%, transparent 50%);
      animation: ambientShift 25s ease-in-out infinite alternate;
    }
    @keyframes ambientShift {
      0% { transform: scale(1) rotate(0deg); opacity: 1; }
      100% { transform: scale(1.08) rotate(2deg); opacity: 0.8; }
    }
    /* Noise texture overlay */
    .bg-ambient::after {
      content: ''; position: fixed; inset: 0;
      opacity: 0.025;
      background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 256 256' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.9' numOctaves='4'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)'/%3E%3C/svg%3E");
      pointer-events: none;
    }

    /* ── App Shell ── */
    #app {
      position: relative; z-index: 1;
      height: 100dvh; max-width: 480px; margin: 0 auto;
      display: flex; flex-direction: column;
      padding: 0 var(--space-5);
    }

    /* ── Header ── */
    .hd {
      padding: var(--space-12) 0 var(--space-2); flex-shrink: 0;
      display: flex; align-items: center; justify-content: space-between;
    }
    .hd-brand {
      display: flex; align-items: center; gap: var(--space-3);
      font-size: var(--font-xl); font-weight: 800; letter-spacing: -0.3px;
    }
    .hd-brand svg { width: 28px; height: 28px; }
    .hd-step {
      font-size: var(--font-md); font-weight: 500;
      color: var(--text-tertiary); letter-spacing: 0.3px;
    }
    .hd-step span { color: var(--primary-light); }

    /* ── Progress ── */
    .pr {
      padding: 0 0 var(--space-6); flex-shrink: 0;
    }
    .pr-track {
      height: 4px; background: var(--bg-elevated);
      border-radius: 4px; overflow: hidden; position: relative;
    }
    .pr-fill {
      height: 100%; border-radius: 4px; width: 0%;
      background: var(--gradient);
      transition: width 0.6s var(--ease-spring);
      position: relative;
    }
    .pr-fill::after {
      content: ''; position: absolute; right: -3px; top: -2px;
      width: 8px; height: 8px; border-radius: 50%;
      background: var(--primary); opacity: 0.5; filter: blur(4px);
    }

    /* ── Slides Container ── */
    .sl {
      flex: 1; position: relative; overflow: hidden;
      margin: 0 calc(-1 * var(--space-2)); padding: 0 var(--space-2);
    }
    .slide {
      position: absolute; inset: 0;
      display: flex; flex-direction: column; justify-content: center;
      opacity: 0; transform: translateY(20px) scale(0.97);
      transition: opacity 0.45s var(--ease-out), transform 0.5s var(--ease-spring);
      pointer-events: none;
    }
    .slide.active { opacity: 1; transform: translateY(0) scale(1); pointer-events: auto; }
    .slide.dismiss { opacity: 0; transform: translateY(-16px) scale(0.95); }

    /* ── Question ── */
    .q-num {
      font-size: var(--font-sm); font-weight: 600;
      color: var(--primary-light); letter-spacing: 1.5px; text-transform: uppercase;
      margin-bottom: var(--space-1);
    }
    .q-title {
      font-size: var(--font-4xl); font-weight: 800;
      line-height: 1.1; letter-spacing: -0.5px;
      margin-bottom: var(--space-1);
    }
    .q-sub {
      font-size: var(--font-base); color: var(--text-secondary);
      margin-bottom: var(--space-8); font-weight: 400;
    }

    /* ── Options Grid ── */
    .opts {
      display: grid; gap: var(--space-3);
    }
    .opts-2 { grid-template-columns: 1fr 1fr; }
    .opts-3 { grid-template-columns: 1fr 1fr 1fr; }
    .opts-4 { grid-template-columns: 1fr 1fr; }

    /* ── Option Card ── */
    .opt {
      background: var(--surface); border: 1px solid var(--border);
      border-radius: var(--radius-md); padding: var(--space-5) var(--space-3);
      text-align: center; cursor: pointer;
      transition: all var(--duration-normal) var(--ease-spring);
      display: flex; flex-direction: column; align-items: center; gap: var(--space-2);
      position: relative; overflow: hidden;
      min-height: 80px;
      -webkit-tap-highlight-color: transparent;
      outline: none;
    }
    .opt:focus-visible { box-shadow: 0 0 0 2px var(--primary); }
    .opt:hover { background: var(--bg-hover); border-color: var(--border-hover); }
    .opt:active { transform: scale(0.96); }
    .opt svg { width: 28px; height: 28px; color: var(--text-secondary); transition: color var(--duration-normal) ease; }
    .opt .lbl {
      font-size: var(--font-md); font-weight: 500;
      color: var(--text-secondary); line-height: 1.2;
      transition: color var(--duration-normal) ease;
    }
    .opt.selected {
      border-color: var(--border-selected);
      background: var(--bg-selected);
      box-shadow: 0 0 30px rgba(124,58,237,0.08);
    }
    .opt.selected svg { color: var(--primary-light); }
    .opt.selected .lbl { color: var(--text); }
    .opt.selected::after {
      content: ''; position: absolute; top: -1px; left: 25%; right: 25%;
      height: 2px; background: var(--gradient); border-radius: 2px;
    }

    /* ── Full-width Option ── */
    .opt-fw {
      background: var(--surface); border: 1px solid var(--border);
      border-radius: var(--radius-md); padding: var(--space-5);
      text-align: center; cursor: pointer;
      transition: all var(--duration-normal) var(--ease-spring);
      display: flex; align-items: center; justify-content: center; gap: var(--space-3);
      min-height: 56px;
      -webkit-tap-highlight-color: transparent;
      outline: none;
    }
    .opt-fw:focus-visible { box-shadow: 0 0 0 2px var(--primary); }
    .opt-fw:hover { background: var(--bg-hover); border-color: var(--border-hover); }
    .opt-fw:active { transform: scale(0.97); }
    .opt-fw svg { width: 24px; height: 24px; color: var(--text-secondary); }
    .opt-fw .lbl { font-size: var(--font-lg); font-weight: 500; color: var(--text-secondary); }
    .opt-fw.selected {
      border-color: var(--border-selected);
      background: var(--bg-selected);
      box-shadow: 0 0 30px rgba(124,58,237,0.08);
    }
    .opt-fw.selected svg { color: var(--primary-light); }
    .opt-fw.selected .lbl { color: var(--text); }

    /* ── Next Button ── */
    .nv { padding: var(--space-4) 0 var(--space-8); flex-shrink: 0; }
    .btn-primary {
      width: 100%; padding: var(--space-5);
      border: none; border-radius: var(--radius-md);
      font-size: var(--font-lg); font-weight: 600; font-family: inherit;
      background: var(--gradient);
      color: #fff; cursor: pointer;
      transition: all var(--duration-normal) var(--ease-spring);
      opacity: 0.2; pointer-events: none;
      position: relative; overflow: hidden;
      letter-spacing: -0.1px;
    }
    .btn-primary.enabled { opacity: 1; pointer-events: auto; }
    .btn-primary.enabled:hover { transform: translateY(-1px); box-shadow: 0 12px 32px rgba(124,58,237,0.25); }
    .btn-primary:active { transform: scale(0.97); }
    .btn-primary .arrow { display: inline-block; transition: transform var(--duration-fast) ease; }
    .btn-primary.enabled:hover .arrow { transform: translateX(4px); }

    /* ── Skip Hint ── */
    .hint {
      text-align: center; margin-top: var(--space-2);
      font-size: var(--font-sm); color: var(--text-tertiary);
      font-weight: 400;
    }

    /* ── RESULTS ── */
    .rv { height: 100%; display: flex; flex-direction: column; padding-top: var(--space-1); }
    .rv-head { display: flex; align-items: flex-start; gap: var(--space-3); margin-bottom: var(--space-5); flex-shrink: 0; flex-direction: column; }
    .rv-head h2 { font-size: var(--font-3xl); font-weight: 800; letter-spacing: -0.3px; }
    .rv-head .sub { font-size: var(--font-base); color: var(--text-secondary); }
    .rv-scroll {
      flex: 1; overflow-y: auto; -webkit-overflow-scrolling: touch;
      padding: 0 var(--space-1) var(--space-3);
    }
    .rv-scroll::-webkit-scrollbar { width: 3px; }
    .rv-scroll::-webkit-scrollbar-thumb { background: var(--bg-hover); border-radius: 3px; }

    /* ── Result Card ── */
    .rc {
      background: var(--surface); border: 1px solid var(--border);
      border-radius: var(--radius-lg); padding: var(--space-5);
      margin-bottom: var(--space-3);
      position: relative; overflow: hidden;
      cursor: pointer; transition: all var(--duration-fast) ease;
      -webkit-tap-highlight-color: transparent;
    }
    .rc:active { transform: scale(0.98); }
    .rc::before {
      content: ''; position: absolute; top: 0; left: 0; right: 0;
      height: 3px; background: var(--gradient-accent); opacity: 0.5;
    }
    .rc .rank {
      font-size: var(--font-sm); font-weight: 600;
      color: var(--primary-light); text-transform: uppercase;
      letter-spacing: 1px; margin-bottom: var(--space-1);
    }
    .rc .title {
      font-size: var(--font-2xl); font-weight: 700;
      letter-spacing: -0.2px; margin-bottom: var(--space-1);
    }
    .rc .meta {
      display: flex; align-items: center; gap: var(--space-2);
      font-size: var(--font-md); color: var(--text-secondary);
      margin-bottom: var(--space-3); flex-wrap: wrap;
    }
    .rc .meta .dot { width: 3px; height: 3px; border-radius: 50%; background: var(--text-tertiary); flex-shrink: 0; }
    .rc .match-badge {
      display: inline-flex; align-items: center; gap: 3px;
      font-size: var(--font-xs); font-weight: 600; color: var(--success);
      background: rgba(52,211,153,0.08); padding: 2px var(--space-2);
      border-radius: 20px; border: 1px solid rgba(52,211,153,0.12);
    }
    .rc .tags {
      display: flex; flex-wrap: wrap; gap: var(--space-1); margin-bottom: var(--space-3);
    }
    .rc .tag {
      font-size: var(--font-xs); font-weight: 500;
      padding: 3px var(--space-2); border-radius: 20px;
      background: var(--bg-elevated); border: 1px solid var(--border);
      color: var(--text-secondary);
    }
    .rc .desc {
      font-size: var(--font-base); color: var(--text-secondary);
      line-height: 1.5; margin-bottom: var(--space-3);
    }
    .rc .act {
      display: flex; gap: var(--space-2);
    }
    .rc .act button {
      padding: var(--space-2) var(--space-4); border: none; border-radius: var(--radius-sm);
      font-size: var(--font-sm); font-weight: 600; font-family: inherit;
      cursor: pointer; transition: all var(--duration-fast) ease;
      min-height: 36px; display: flex; align-items: center; gap: var(--space-1);
    }
    .rc .act button:active { transform: scale(0.95); }
    .rc .act button svg { width: 14px; height: 14px; }
    .btn-wl {
      background: rgba(124,58,237,0.12); color: var(--primary-light);
      border: 1px solid rgba(124,58,237,0.15);
    }
    .btn-wl.saved { background: rgba(52,211,153,0.12); color: var(--success); border-color: rgba(52,211,153,0.15); }
    .btn-watched {
      background: var(--bg-elevated); color: var(--text-secondary);
      border: 1px solid var(--border);
    }
    .btn-watched.seen { background: rgba(245,158,11,0.12); color: var(--accent); }

    /* ── Expandable ── */
    .rc .expand { max-height: 0; overflow: hidden; transition: max-height 0.35s var(--ease-spring); }
    .rc.expanded .expand { max-height: 200px; }
    .exp-inner { padding-top: var(--space-3); border-top: 1px solid var(--border); margin-top: var(--space-4); display: grid; grid-template-columns: 1fr 1fr; gap: var(--space-2); }
    .exp-inner .row { display: flex; flex-direction: column; gap: 2px; }
    .exp-inner .row .lbl { font-size: var(--font-xs); color: var(--text-tertiary); text-transform: uppercase; letter-spacing: 0.5px; }
    .exp-inner .row .val { font-size: var(--font-base); color: var(--text-secondary); font-weight: 500; }

    /* ── Results Bar ── */
    .rbar { display: flex; gap: var(--space-2); flex-shrink: 0; padding: var(--space-2) 0 var(--space-5); }
    .rbar button {
      flex: 1; padding: var(--space-3) var(--space-4); border: none; border-radius: var(--radius-md);
      font-size: var(--font-md); font-weight: 600; font-family: inherit;
      cursor: pointer; transition: all var(--duration-fast) ease; min-height: 48px;
    }
    .rbar button:active { transform: scale(0.96); }
    .btn-refine { background: var(--surface); color: var(--text-secondary); border: 1px solid var(--border); }
    .btn-retake { background: var(--gradient); color: #fff; }
    .btn-share { background: var(--bg-elevated); color: var(--text); border: 1px solid var(--border); }

    /* ── Loading Screen ── */
    .load {
      display: flex; flex-direction: column;
      align-items: center; justify-content: center; gap: var(--space-5);
      height: 100%;
    }
    .load-ring { width: 40px; height: 40px; border: 3px solid var(--border); border-top-color: var(--primary); border-radius: 50%; animation: spin 0.7s linear infinite; }
    @keyframes spin { to { transform: rotate(360deg); } }
    .load p { font-size: var(--font-base); color: var(--text-tertiary); }

    /* ── Toast ── */
    .toast {
      position: fixed; bottom: 32px; left: 50%; transform: translateX(-50%) translateY(80px);
      background: rgba(255,255,255,0.07); backdrop-filter: blur(20px); -webkit-backdrop-filter: blur(20px);
      border: 1px solid var(--border); border-radius: var(--radius-md);
      padding: var(--space-3) var(--space-6); font-size: var(--font-base);
      font-weight: 500; color: var(--text);
      opacity: 0; transition: all var(--duration-slow) var(--ease-spring);
      z-index: 100; pointer-events: none;
      white-space: nowrap;
    }
    .toast.show { opacity: 1; transform: translateX(-50%) translateY(0); }

    /* ── Watchlist Modal ── */
    .modal-overlay {
      position: fixed; inset: 0; z-index: 50;
      background: rgba(0,0,0,0.6); backdrop-filter: blur(12px); -webkit-backdrop-filter: blur(12px);
      display: flex; align-items: flex-end;
      opacity: 0; pointer-events: none;
      transition: opacity var(--duration-normal) ease;
    }
    .modal-overlay.open { opacity: 1; pointer-events: auto; }
    .modal {
      width: 100%; max-width: 480px; margin: 0 auto;
      background: #11111d; border-radius: var(--radius-xl) var(--radius-xl) 0 0;
      padding: var(--space-5) var(--space-5) var(--space-10);
      max-height: 70vh; overflow-y: auto;
      transform: translateY(100%); border-top: 1px solid var(--border);
      transition: transform var(--duration-slow) var(--ease-spring);
    }
    .modal-overlay.open .modal { transform: translateY(0); }
    .modal-handle { width: 36px; height: 4px; background: var(--text-tertiary); border-radius: 4px; margin: 0 auto var(--space-4); opacity: 0.3; }
    .modal h3 { font-size: var(--font-2xl); font-weight: 700; margin-bottom: var(--space-1); }
    .modal .sub { font-size: var(--font-md); color: var(--text-secondary); margin-bottom: var(--space-5); }
    .modal-item {
      display: flex; align-items: center; justify-content: space-between;
      padding: var(--space-4); background: var(--surface);
      border-radius: var(--radius-md); margin-bottom: var(--space-2);
      border: 1px solid var(--border);
    }
    .modal-item .mi-title { font-weight: 600; font-size: var(--font-lg); }
    .modal-item .mi-meta { font-size: var(--font-sm); color: var(--text-secondary); }
    .modal-item button {
      background: rgba(239,68,68,0.1); border: none; color: var(--error);
      padding: var(--space-2) var(--space-4); border-radius: var(--radius-sm);
      font-size: var(--font-sm); font-weight: 600; cursor: pointer; font-family: inherit;
      min-height: 36px;
    }
    .empty-wl { text-align: center; padding: var(--space-10) 0; color: var(--text-tertiary); font-size: var(--font-base); }
    .empty-wl svg { width: 40px; height: 40px; margin-bottom: var(--space-3); opacity: 0.3; }

    /* ── Animations ── */
    @keyframes fadeUp { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }
    .anim-in { animation: fadeUp 0.45s var(--ease-out) forwards; opacity: 0; }
    .d1 { animation-delay: 0.1s; } .d2 { animation-delay: 0.18s; } .d3 { animation-delay: 0.26s; } .d4 { animation-delay: 0.34s; }

    /* ── Responsive ── */
    @media (max-width: 380px) {
      #app { padding: 0 var(--space-4); }
      .q-title { font-size: var(--font-3xl); }
      .opt svg { width: 24px; height: 24px; }
      .opt .lbl { font-size: var(--font-sm); }
      .opt { padding: var(--space-4) var(--space-2); min-height: 72px; }
      .hd { padding-top: var(--space-10); }
    }
    @media (min-width: 481px) {
      #app { border-left: 1px solid var(--border); border-right: 1px solid var(--border); }
    }
  </style>
</head>
<body>
<div class="bg-ambient"></div>

<div id="app">
  <div class="hd">
    <div class="hd-brand">
      <svg viewBox="0 0 28 28" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <rect x="2" y="2" width="20" height="20" rx="4"/>
        <path d="M16 14l-6 4V10l6 4z"/>
        <path d="M22 10l4-2v12l-4-2"/>
      </svg>
      ReelVibe
    </div>
    <div class="hd-step" id="hdStep"><span>1</span>/6</div>
  </div>

  <div class="pr">
    <div class="pr-track"><div class="pr-fill" id="prFill"></div></div>
  </div>

  <div class="sl" id="slWrap"></div>

  <div class="nv">
    <button class="btn-primary" id="btnNext">Next <span class="arrow">→</span></button>
    <div class="hint" id="hint">Tap an option to continue</div>
  </div>
</div>

<div class="toast" id="toastMsg"></div>

<div class="modal-overlay" id="wlOverlay">
  <div class="modal" onclick="event.stopPropagation()">
    <div class="modal-handle"></div>
    <h3>Watchlist</h3>
    <div class="sub" id="wlCount">0 saved</div>
    <div id="wlList"></div>
  </div>
</div>

<script>
// ━━━━━━━━ SVG ICONS ━━━━━━━━━
// (UI-UX Pro Max: SVG icons instead of emojis)

  {t:'What We Do in the Shadows',ty:'series',g:['comedy','dark'],m:['funny','chill'],tm:'binge',e:'recent',i:'light',y:2019,d:'Vampire mockumentary. Ridiculously good.','rt':8.6},
  {t:'Extraction',ty:'movie',g:['action','thriller'],m:['pumped','tense'],tm:'quick',e:'recent',i:'heavy',y:2020,d:'Non-stop adrenaline with Chris Hemsworth.','rt':6.7},
];

// ━━━━━━━━ STATE ━━━━━━━━
let cur = 0;
const ans = {};
let wl = JSON.parse(localStorage.getItem('rv_wl')||'[]');
let wt = JSON.parse(localStorage.getItem('rv_wt')||'[]');

const $ = id => document.getElementById(id);
const wrap = $('slWrap');
const btn = $('btnNext');
const prFill = $('prFill');
const hdStep = $('hdStep');
const toast = $('toastMsg');
const hint = $('hint');

// ━━━━━━━━ RENDER ━━━━━━━━
function render() {
  wrap.innerHTML = Q.map((q,i)=>`
    <div class="slide ${i===0?'active':''}">
      <div class="q-num">${q.num}. ${q.id}</div>
      <div class="q-title">${q.title}</div>
      <div class="q-sub">${q.sub}</div>
      <div class="opts ${q.cols===1?'':'opts-'+q.cols}" role="radiogroup" aria-label="${q.id}">
        ${q.opts.map(o=>`
          <div class="${q.cols===1?'opt-fw':'opt'}" data-q="${q.id}" data-val="${o.i}" role="radio" tabindex="0" aria-label="${o.l}">
            ${icons[o.i]||''}
            <span class="lbl">${o.l}</span>
          </div>
        `).join('')}
      </div>
    </div>
  `).join('');
  updUI();
}

function updUI() {
  const t = Q.length;
  prFill.style.width = Math.round((cur/t)*100)+'%';
  hdStep.innerHTML = `<span>${Math.min(cur+1,t)}</span>/${t}`;
  if (cur < t) {
    const last = cur === t-1;
    btn.innerHTML = last ? 'Get My Picks <span class="arrow">→</span>' : 'Next <span class="arrow">→</span>';
    btn.classList.toggle('enabled', !!ans[Q[cur]?.id]);
    hint.textContent = cur===0 ? 'Tap an option to begin' : 'Tap an option to continue';
  }
}

// ━━━━━━━━ NAV ━━━━━━━━
function slideTo(n) {
  const slides = wrap.querySelectorAll('.slide');
  slides.forEach(s=>{s.classList.remove('active','dismiss')});
  if (n > cur) slides[cur]?.classList.add('dismiss');
  slides[n]?.classList.add('active');
  cur = n;
  updUI();
  bindNav();
}

function bindNav() {
  btn.onclick = ()=>{
    if (!btn.classList.contains('enabled')) return;
    if (cur < Q.length-1) slideTo(cur+1);
    else compute();
  };
}

// ━━━━━━━━ SELECTION ━━━━━━━━
wrap.addEventListener('click', e => {
  const el = e.target.closest('.opt, .opt-fw');
  if (!el) return;
  const qId = el.dataset.q, val = el.dataset.val;
  if (!qId) return;
  el.closest('.slide').querySelectorAll('.opt, .opt-fw').forEach(x=>x.classList.remove('selected'));
  el.classList.add('selected');
  ans[qId] = val;
  btn.classList.add('enabled');
});

// Keyboard nav
wrap.addEventListener('keydown', e => {
  if (e.key === 'Enter' || e.key === ' ') {
    const el = e.target.closest('.opt, .opt-fw');
    if (el) { e.preventDefault(); el.click(); }
  }
});

// ━━━━━━━━ ENGINE ━━━━━━━━
function score(item) {
  let s = 0;
  if (item.m.includes(ans.mood)) s += 30;
  if (item.g.includes(ans.genre)) s += 28;
  if (ans.type === 'either') s += 10;
  else if (item.ty === ans.type) s += 20;
  if (ans.time === 'quick' && item.tm === 'quick') s += 12;
  else if (ans.time === 'standard' && item.tm === 'standard') s += 12;
  else if (ans.time === 'binge' && (item.tm==='binge'||item.tm==='epic')) s += 10;
  else if (ans.time === 'epic' && item.tm === 'epic') s += 12;
  else if (ans.time==='standard'&&item.tm==='quick') s+=5;
  else if (ans.time==='binge'&&item.tm==='standard') s+=4;
  if (!ans.era||ans.era==='any') s+=10;
  else if (item.e===ans.era) s+=10;
  else if ((ans.era==='classic'||ans.era==='2000s')&&(item.e==='classic'||item.e==='2000s')) s+=6;
  else if ((ans.era==='recent')&&(item.e==='recent'||item.e==='2010s')) s+=6;
  if (item.i===ans.intensity) s+=6;
  else if (ans.intensity==='medium'&&(item.i==='light'||item.i==='heavy')) s+=2;
  if (ans.mood==='tense'&&item.g.includes('dark')) s+=4;
  if (ans.mood==='chill'&&item.g.includes('comedy')) s+=4;
  return s;
}

function recommend() {
  const sc = DB.map(d=>({...d,s:score(d)}));
  sc.sort((a,b)=>b.s - a.s);
  const seen=new Set(), top=[];
  for (const i of sc) {
    const k=i.t.toLowerCase().replace(/[^a-z0-9]/g,'');
    if (!seen.has(k)&&!wt.includes(k)) { seen.add(k); top.push(i); }
    if (top.length>=5) break;
  }
  return top;
}

// ━━━━━━━━ RESULTS ━━━━━━━━
function compute() {
  wrap.innerHTML = `<div class="slide active"><div class="load"><div class="load-ring"></div><p>Analyzing your taste...</p></div></div>`;
  btn.classList.remove('enabled');
  btn.textContent = '⋯';
  setTimeout(()=>show(recommend()), 600);
}

function show(picks, ref) {
  const maxS = Math.max(...picks.map(p=>p.s),1);
  const rank = ['Top Pick','Second Pick','Third Pick','Fourth','Fifth'];

  wrap.innerHTML = `<div class="slide active"><div class="rv">
    <div class="rv-head">
      <h2>${ref?'Refreshed':'Your Picks'}</h2>
      <div class="sub">${ref?'Here\'s a different take':`We found your top ${picks.length}`}</div>
    </div>
    <div class="rv-scroll">
      ${picks.map((item,i)=>{
        const pct = Math.round((item.s/maxS)*100);
        const k = item.t.toLowerCase().replace(/[^a-z0-9]/g,'');
        const w = wl.includes(k);
        const il = item.i==='light'?'🌿':item.i==='medium'?'⚡':'🌋';
        return `<div class="rc anim-in d${Math.min(i+1,4)}" data-key="${k}" onclick="this.classList.toggle('expanded')" tabindex="0" role="button" aria-label="${item.t} details">
          <div class="rank">${i===0?'🥇':i===1?'🥈':i===2?'🥉':i===3?'4️⃣':'5️⃣'} ${rank[i]}</div>
          <div class="title">${item.t}</div>
          <div class="meta">
            <span>${item.y}</span><span class="dot"></span>
            <span>${item.ty==='movie'?'Movie':'Series'}</span><span class="dot"></span>
            <span>${il} ${item.i}</span>
            <span class="match-badge">${icons.check} ${pct}%</span>
          </div>
          <div class="tags">${item.g.map(g=>`<span class="tag">${g}</span>`).join('')}
          ${item.rt?`<span class="tag">★ ${item.rt}</span>`:''}</div>
          <div class="desc">${item.d}</div>
          <div class="act">
            <button class="btn-wl ${w?'saved':''}" onclick="event.stopPropagation();tglWl('${k}','${item.t.replace(/'/g,"\\'")}',this)">${icons[w?'check':'bookmark']} ${w?'Saved':'Watchlist'}</button>
            <button class="btn-watched ${wt.includes(k)?'seen':''}" onclick="event.stopPropagation();tglWt('${k}',this)">${icons.eye} ${wt.includes(k)?'Seen':'Watched'}</button>
          </div>
          <div class="expand"><div class="exp-inner">
            <div class="row"><span class="lbl">Year</span><span class="val">${item.y}</span></div>
            <div class="row"><span class="lbl">Rating</span><span class="val">★ ${item.rt}/10</span></div>
            <div class="row"><span class="lbl">Type</span><span class="val">${item.ty==='movie'?'Movie':'Series'}</span></div>
            <div class="row"><span class="lbl">Length</span><span class="val">${item.tm==='quick'?'⏱ Quick':item.tm==='standard'?'🎞 Standard':item.tm==='binge'?'🍿 Binge':'🏰 Epic'}</span></div>
          </div></div>
        </div>`;
      }).join('')}
    </div>
    <div class="rbar">
      <button class="btn-refine" onclick="refine()">↻ Refresh</button>
      <button class="btn-share" onclick="share()">${icons.share} Share</button>
      <button class="btn-retake" onclick="retake()">Retake</button>
    </div>
  </div></div>`;
  prFill.style.width='100%';
  hdStep.innerHTML = '✨ Done';
  btn.classList.remove('enabled');
  btn.innerHTML = `${icons.list} Watchlist`;
  btn.onclick = openWL;
}

function refine() {
  wrap.innerHTML = `<div class="slide active"><div class="load"><div class="load-ring"></div><p>Something different...</p></div></div>`;
  setTimeout(()=>{
    const p = recommend();
    if (p.length>2) {
      const rest = DB.filter(d=>!p.some(x=>x.t===d.t));
      if (rest.length) {
        const r = rest[Math.floor(Math.random()*rest.length)];
        p[p.length-1] = {...r, s:score(r)};
      }
    }
    p.sort((a,b)=>b.s-a.s);
    show(p.slice(0,5), true);
  },500);
}

// ━━━━━━━━ WATCHLIST ━━━━━━━━
function tglWl(key,title,el) {
  const i=wl.indexOf(key);
  if(i>-1){wl.splice(i,1);if(el){el.innerHTML=`${icons.bookmark} Watchlist`;el.classList.remove('saved');}showToast('Removed from watchlist');}
  else{wl.push(key);if(el){el.innerHTML=`${icons.check} Saved`;el.classList.add('saved');}showToast('Added to watchlist');}
  localStorage.setItem('rv_wl',JSON.stringify(wl));
}

function tglWt(key,el) {
  const i=wt.indexOf(key);
  if(i>-1){wt.splice(i,1);if(el){el.innerHTML=`${icons.eye} Watched`;el.classList.remove('seen');}showToast('Marked as unwatched');}
  else{wt.push(key);if(el){el.innerHTML=`${icons.check} Seen`;el.classList.add('seen');}showToast('Marked as watched');
    const wi=wl.indexOf(key);if(wi>-1){wl.splice(wi,1);localStorage.setItem('rv_wl',JSON.stringify(wl));}}
  localStorage.setItem('rv_wt',JSON.stringify(wt));
}

function openWL() {
  const ov=$('wlOverlay'), list=$('wlList'), cnt=$('wlCount');
  cnt.textContent=`${wl.length} saved`;
  if(!wl.length){list.innerHTML=`<div class="empty-wl"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><path d="M19 21l-7-5-7 5V5a2 2 0 012-2h10a2 2 0 012 2v16z"/></svg><br>Nothing saved yet<br><span style="font-size:13px;">Tap Watchlist on any recommendation</span></div>`;}
  else{list.innerHTML=wl.map(k=>{const item=DB.find(d=>d.t.toLowerCase().replace(/[^a-z0-9]/g,'')===k);return item?`<div class="modal-item"><div><div class="mi-title">${item.t}</div><div class="mi-meta">${item.y} · ${item.ty==='movie'?'Movie':'Series'}</div></div><button onclick="rmWL('${k}')">Remove</button></div>`:'';}).join('');}
  ov.classList.add('open');
}

function rmWL(key){const i=wl.indexOf(key);if(i>-1){wl.splice(i,1);localStorage.setItem('rv_wl',JSON.stringify(wl));openWL();const btn=document.querySelector(`.btn-wl[data-key="${key}"]`);if(btn){btn.innerHTML=`${icons.bookmark} Watchlist`;btn.classList.remove('saved');}showToast('Removed');}}
$('wlOverlay').addEventListener('click',e=>{if(e.target===e.currentTarget)e.currentTarget.classList.remove('open')});

// ━━━━━━━━ SHARE ━━━━━━━━
function share() {
  const titles = [...document.querySelectorAll('.rc .title')].map(el=>el.textContent);
  if(!titles.length) return;
  const text = `My ReelVibe picks:\n\n${titles.map((t,i)=>['🥇','🥈','🥉','4️⃣','5️⃣'][i]+' '+t).join('\n')}\n\nreelvibe.app`;
  if(navigator.share){navigator.share({title:'ReelVibe',text}).catch(()=>{});}
  else{navigator.clipboard.writeText(text).then(()=>showToast('Copied!')).catch(()=>{});}
}

// ━━━━━━━━ RETAKE ━━━━━━━━
function retake() {
  Object.keys(ans).forEach(k=>delete ans[k]);
  cur=0; render(); bindNav();
  btn.innerHTML='Next <span class="arrow">→</span>';
  btn.classList.remove('enabled');
  prFill.style.width='0%';
  hdStep.innerHTML='<span>1</span>/6';
  hint.textContent='Tap an option to begin';
  btn.onclick=null; bindNav();
}

// ━━━━━━━━ TOAST ━━━━━━━━
let tt;
function showToast(m){toast.textContent=m;toast.classList.add('show');clearTimeout(tt);tt=setTimeout(()=>toast.classList.remove('show'),2000);}

// ━━━━━━━━ BOOT ━━━━━━━━
render(); bindNav();
</script>
