<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>ReelVibe 🎬</title>
  <style>
    /* ── Reset & Base ── */
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    html, body {
      height: 100%;
      overflow: hidden;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      background: #0a0a0f;
      color: #e8e8f0;
      -webkit-tap-highlight-color: transparent;
      user-select: none;
    }

    /* ── App shell ── */
    #app {
      height: 100dvh;
      display: flex;
      flex-direction: column;
      max-width: 500px;
      margin: 0 auto;
      position: relative;
      overflow: hidden;
    }

    /* ── Progress bar ── */
    .progress-wrap {
      padding: 20px 24px 0;
      flex-shrink: 0;
    }
    .progress-bar {
      height: 4px;
      background: #1e1e2a;
      border-radius: 4px;
      overflow: hidden;
      position: relative;
    }
    .progress-fill {
      height: 100%;
      width: 0%;
      background: linear-gradient(90deg, #a855f7, #ec4899);
      border-radius: 4px;
      transition: width 0.5s cubic-bezier(0.22, 1, 0.36, 1);
    }
    .progress-label {
      display: flex;
      justify-content: space-between;
      font-size: 12px;
      color: #6b6b80;
      margin-top: 6px;
    }
    .progress-label span:last-child { color: #a855f7; }

    /* ── Slide container ── */
    .slides-container {
      flex: 1;
      position: relative;
      overflow: hidden;
      margin: 0 16px;
    }
    .slide {
      position: absolute;
      inset: 0;
      display: flex;
      flex-direction: column;
      justify-content: center;
      opacity: 0;
      transform: translateX(40px) scale(0.96);
      transition: all 0.5s cubic-bezier(0.22, 1, 0.36, 1);
      pointer-events: none;
      padding: 16px 0;
    }
    .slide.active {
      opacity: 1;
      transform: translateX(0) scale(1);
      pointer-events: auto;
    }
    .slide.exit-left {
      opacity: 0;
      transform: translateX(-40px) scale(0.96);
    }

    /* ── Question header ── */
    .q-label {
      font-size: 12px;
      text-transform: uppercase;
      letter-spacing: 2px;
      color: #a855f7;
      font-weight: 600;
      margin-bottom: 8px;
    }
    .q-title {
      font-size: 26px;
      font-weight: 700;
      line-height: 1.2;
      margin-bottom: 6px;
    }
    .q-sub {
      font-size: 14px;
      color: #8888a0;
      margin-bottom: 24px;
    }

    /* ── Option grid ── */
    .options {
      display: grid;
      gap: 10px;
    }
    .options-2 { grid-template-columns: 1fr 1fr; }
    .options-3 { grid-template-columns: 1fr 1fr 1fr; }
    .options-4 { grid-template-columns: 1fr 1fr; }
    .options-6 { grid-template-columns: 1fr 1fr 1fr; }

    .option {
      background: #14141f;
      border: 1.5px solid #1e1e2e;
      border-radius: 16px;
      padding: 16px 12px;
      text-align: center;
      cursor: pointer;
      transition: all 0.25s ease;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 6px;
      -webkit-tap-highlight-color: transparent;
    }
    .option:active { transform: scale(0.96); }
    .option .emoji {
      font-size: 28px;
      line-height: 1;
    }
    .option .label {
      font-size: 13px;
      font-weight: 500;
      color: #c0c0d0;
      line-height: 1.2;
    }
    .option.selected {
      border-color: #a855f7;
      background: #1a1a2e;
      box-shadow: 0 0 20px rgba(168,85,247,0.12);
    }
    .option.selected .label { color: #fff; }

    /* ── Full-width option ── */
    .option-full {
      width: 100%;
      padding: 18px;
      border-radius: 16px;
      background: #14141f;
      border: 1.5px solid #1e1e2e;
      text-align: center;
      cursor: pointer;
      transition: all 0.25s ease;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
    }
    .option-full .emoji { font-size: 24px; }
    .option-full .label { font-size: 15px; font-weight: 500; color: #c0c0d0; }
    .option-full.selected {
      border-color: #a855f7;
      background: #1a1a2e;
      box-shadow: 0 0 20px rgba(168,85,247,0.12);
    }
    .option-full.selected .label { color: #fff; }

    /* ── Bottom nav ── */
    .nav-area {
      padding: 16px 24px 28px;
      flex-shrink: 0;
    }
    .btn-next {
      width: 100%;
      padding: 16px;
      border: none;
      border-radius: 14px;
      font-size: 16px;
      font-weight: 600;
      background: linear-gradient(135deg, #a855f7, #ec4899);
      color: #fff;
      cursor: pointer;
      transition: all 0.3s ease;
      opacity: 0.4;
      pointer-events: none;
    }
    .btn-next.enabled {
      opacity: 1;
      pointer-events: auto;
    }
    .btn-next:active { transform: scale(0.97); }

    /* ── Results slide ── */
    .results-wrap {
      display: flex;
      flex-direction: column;
      height: 100%;
      padding-top: 8px;
    }
    .results-scroll {
      flex: 1;
      overflow-y: auto;
      padding: 0 2px 16px;
      -webkit-overflow-scrolling: touch;
    }
    .results-scroll::-webkit-scrollbar { width: 3px; }
    .results-scroll::-webkit-scrollbar-thumb { background: #2a2a3e; border-radius: 3px; }

    .result-card {
      background: linear-gradient(135deg, #14141f 0%, #1a1a2e 100%);
      border: 1px solid #1e1e2e;
      border-radius: 20px;
      padding: 20px;
      margin-bottom: 12px;
      position: relative;
      overflow: hidden;
    }
    .result-card::before {
      content: '';
      position: absolute;
      top: 0; left: 0; right: 0;
      height: 3px;
      background: linear-gradient(90deg, #a855f7, #ec4899);
      border-radius: 20px 20px 0 0;
    }
    .result-card .rank {
      font-size: 12px;
      font-weight: 600;
      color: #a855f7;
      text-transform: uppercase;
      letter-spacing: 1px;
      margin-bottom: 4px;
    }
    .result-card .title {
      font-size: 22px;
      font-weight: 700;
      margin-bottom: 2px;
    }
    .result-card .meta {
      font-size: 13px;
      color: #8888a0;
      margin-bottom: 10px;
    }
    .result-card .tags {
      display: flex;
      flex-wrap: wrap;
      gap: 6px;
    }
    .result-card .tag {
      font-size: 11px;
      padding: 3px 10px;
      border-radius: 20px;
      background: #1e1e2e;
      color: #c0c0d0;
      border: 1px solid #2a2a40;
    }
    .result-card .desc {
      font-size: 14px;
      color: #a0a0b8;
      margin-top: 10px;
      line-height: 1.5;
    }

    .results-cta {
      margin-top: 16px;
      display: flex;
      gap: 10px;
    }
    .results-cta button {
      flex: 1;
      padding: 14px;
      border: none;
      border-radius: 14px;
      font-size: 14px;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.25s ease;
    }
    .results-cta button:active { transform: scale(0.96); }
    .btn-retake {
      background: #1e1e2e;
      color: #c0c0d0;
      border: 1px solid #2a2a40 !important;
    }
    .btn-share {
      background: linear-gradient(135deg, #a855f7, #ec4899);
      color: #fff;
    }

    .results-header {
      display: flex;
      align-items: center;
      gap: 12px;
      margin-bottom: 16px;
    }
    .results-header h2 {
      font-size: 22px;
      font-weight: 700;
    }
    .results-header .sub {
      font-size: 13px;
      color: #8888a0;
    }

    /* ── Loading ── */
    .loading {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 16px;
      height: 100%;
    }
    .spinner {
      width: 36px;
      height: 36px;
      border: 3px solid #1e1e2e;
      border-top: 3px solid #a855f7;
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
    }
    @keyframes spin { to { transform: rotate(360deg); } }
    .loading p { color: #8888a0; font-size: 14px; }

    /* ── Animations ── */
    @keyframes fadeUp {
      from { opacity: 0; transform: translateY(12px); }
      to { opacity: 1; transform: translateY(0); }
    }
    .fade-in { animation: fadeUp 0.4s ease forwards; opacity: 0; }

    /* ── Responsive tweaks ── */
    @media (max-width: 380px) {
      .q-title { font-size: 22px; }
      .option .emoji { font-size: 24px; }
      .option .label { font-size: 12px; }
    }
    @media (min-width: 500px) {
      #app { border-left: 1px solid #1a1a2a; border-right: 1px solid #1a1a2a; }
    }
  </style>
</head>

// ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
//  STATE
// ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
let currentSlide = 0;
const answers = {};

// ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
//  DOM refs
// ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
const container = document.getElementById('slidesContainer');
const btnNext = document.getElementById('btnNext');
const progressFill = document.getElementById('progressFill');
const qCount = document.getElementById('qCount');
const qName = document.getElementById('qName');

// ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
//  RENDER
// ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
function renderSlides() {
  container.innerHTML = QUESTIONS.map((q, i) => {
    const optClass = q.cols === 1 ? '' : `options-${q.cols}`;
    return `
      <div class="slide ${i === 0 ? 'active' : ''}" data-idx="${i}">
        <div class="q-label">${q.label}</div>
        <div class="q-title">${q.title}</div>
        <div class="q-sub">${q.sub}</div>
        <div class="options ${optClass}">
          ${q.options.map(o => `
            <div class="${q.cols === 1 ? 'option-full' : 'option'}" data-q="${q.id}" data-val="${o.val}">
              <span class="emoji">${o.emoji}</span>
              <span class="label">${o.label}</span>
            </div>
          `).join('')}
        </div>
      </div>
    `;
  }).join('');
  updateProgress();
}

// ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
//  NAVIGATION
// ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
function goToSlide(idx) {
  const slides = container.querySelectorAll('.slide');
  slides.forEach(s => s.classList.remove('active', 'exit-left'));
  if (idx > currentSlide) {
    slides[currentSlide].classList.add('exit-left');
  }
  slides[idx].classList.add('active');
  currentSlide = idx;
  updateProgress();
  btnNext.textContent = currentSlide === QUESTIONS.length - 1 ? '🎯 Show Me' : 'Next →';
  btnNext.classList.toggle('enabled', !!answers[QUESTIONS[currentSlide]?.id]);
  // scroll results if on last slide
  if (currentSlide === QUESTIONS.length) {
    setTimeout(() => document.querySelector('.results-scroll')?.scrollTo({ top: 0 }), 100);
  }
}

function updateProgress() {
  const total = QUESTIONS.length;
  const pct = Math.round((currentSlide / total) * 100);
  progressFill.style.width = pct + '%';
  qCount.textContent = `${currentSlide + 1} / ${total}`;
  qName.textContent = currentSlide < total ? QUESTIONS[currentSlide].label : 'Results';
}

// ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
//  SELECTION
// ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
container.addEventListener('click', e => {
  const opt = e.target.closest('.option, .option-full');
  if (!opt) return;
  const qId = opt.dataset.q;
  const val = opt.dataset.val;
  const parent = opt.closest('.slide');
  // deselect siblings
  parent.querySelectorAll('.option, .option-full').forEach(el => el.classList.remove('selected'));
  opt.classList.add('selected');
  answers[qId] = val;
  btnNext.classList.add('enabled');
});

btnNext.addEventListener('click', () => {
  if (!btnNext.classList.contains('enabled')) return;
  if (currentSlide < QUESTIONS.length - 1) {
    goToSlide(currentSlide + 1);
  } else {
    showResults();
  }
});

// ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
//  ALGORITHM — weighted scoring
// ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
function recommend() {
  const scored = DB.map(item => {
    let score = 0;

    // Mood match (+30)
    if (item.moods.includes(answers.mood)) score += 30;

    // Genre match (+25)
    if (item.genres.includes(answers.genre)) score += 25;

    // Type match (+20)
    if (answers.type === 'either') score += 10; // partial
    else if (item.type === answers.type) score += 20;

    // Time match (+10)
    const timeMap = {
      'quick': 'quick', 'standard': 'standard', 'binge': 'binge', 'epic': 'epic'
    };
    if (answers.time === 'quick' && item.time === 'quick') score += 10;
    else if (answers.time === 'standard' && item.time === 'standard') score += 10;
    else if (answers.time === 'binge' && (item.time === 'binge' || item.time === 'epic')) score += 8;
    else if (answers.time === 'epic' && item.time === 'epic') score += 10;
    else if (answers.time === 'standard' && item.time === 'quick') score += 5;
    else if (answers.time === 'binge' && item.time === 'standard') score += 4;

    // Era match (+10)
    const eraMap = {
      'classic': ['classic'],
      '2000s': ['2000s'],
      'recent': ['recent'],
      'any': ['classic','2000s','2010s','recent']
    };
    if (eraMap[answers.era]?.includes(item.era)) score += 10;

    // Intensity match (+5)
    if (item.intensity === answers.intensity) score += 5;
    else if (answers.intensity === 'medium' && item.intensity === 'heavy') score += 2;
    else if (answers.intensity === 'medium' && item.intensity === 'light') score += 2;

    // Dark genre bonus
    if (answers.mood === 'tense' && item.genres.includes('dark')) score += 3;
    if (answers.mood === 'chill' && item.genres.includes('comedy')) score += 3;

    return { ...item, score };
  });

  // Sort by score descending, then pick top 3
  scored.sort((a, b) => b.score - a.score);
  // Deduplicate — ensure we don't show same franchise twice
  const top = [];
  const seen = new Set();
  for (const item of scored) {
    if (top.length >= 5) break;
    const key = item.title.toLowerCase().replace(/[^a-z0-9]/g, '');
    if (!seen.has(key)) {
      seen.add(key);
      top.push(item);
    }
  }
  return top.slice(0, 3);
}

// ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
//  RESULTS
// ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
function showResults() {
  // Show loading
  container.innerHTML = `
    <div class="slide active">
      <div class="loading">
        <div class="spinner"></div>
        <p>Reading your vibe...</p>
      </div>
    </div>
  `;
  btnNext.classList.remove('enabled');
  btnNext.textContent = '✨';

  setTimeout(() => {
    const picks = recommend();
    const rankEmojis = ['🥇', '🥈', '🥉'];
    const ranks = ['Top Pick', 'Second Pick', 'Third Pick'];

    container.innerHTML = `
      <div class="slide active results-wrap">
        <div class="results-header">
          <div>
            <h2>Your Picks 🎯</h2>
            <div class="sub">Based on your vibe, here's what hits</div>
          </div>
        </div>
        <div class="results-scroll">
          ${picks.map((item, i) => `
            <div class="result-card fade-in" style="animation-delay: ${i * 0.12}s">
              <div class="rank">${rankEmojis[i]} ${ranks[i]} · Score ${item.score}</div>
              <div class="title">${item.title}</div>
              <div class="meta">${item.year} · ${item.type === 'movie' ? '🎬 Movie' : '📺 Series'} · ${item.intensity === 'light' ? '🌿 Light' : item.intensity === 'medium' ? '⚡ Medium' : '🌋 Heavy'}</div>
              <div class="tags">
                ${item.genres.map(g => `<span class="tag">${g}</span>`).join('')}
                ${item.moods.map(m => `<span class="tag">${m}</span>`).join('')}
              </div>
              <div class="desc">${item.desc}</div>
            </div>
          `).join('')}
          <div class="results-cta fade-in" style="animation-delay: 0.4s">
            <button class="btn-retake" onclick="retake()">↻ Retake</button>
            <button class="btn-share" onclick="sharePicks()">📤 Share</button>
          </div>
        </div>
      </div>
    `;
    progressFill.style.width = '100%';
    qCount.textContent = '🎉 Done';
    qName.textContent = 'Results';
    btnNext.textContent = '↻ Retake';
    btnNext.classList.add('enabled');
    btnNext.onclick = retake;
  }, 800);
}

function retake() {
  Object.keys(answers).forEach(k => delete answers[k]);
  currentSlide = 0;
  btnNext.onclick = null; // reset
  renderSlides();
  btnNext.textContent = 'Next →';
  btnNext.classList.remove('enabled');
  // Re-attach event (the old one was from showResults)
  // The click listener already handles via closure, but we need to reset btnNext.onclick
  btnNext.onclick = () => {
    if (!btnNext.classList.contains('enabled')) return;
    if (currentSlide < QUESTIONS.length - 1) {
      goToSlide(currentSlide + 1);
    } else {
      showResults();
    }
  };
}

function sharePicks() {
  const picks = document.querySelectorAll('.result-card .title');
  if (!picks.length) return;
  const titles = Array.from(picks).map(el => el.textContent);
  const text = `🎬 ReelVibe recommends:\n\n🥇 ${titles[0]}\n🥈 ${titles[1]}\n🥉 ${titles[2]}\n\nFind your vibe →`;
  if (navigator.share) {
    navigator.share({ title: 'ReelVibe Picks', text }).catch(() => {});
  } else {
    navigator.clipboard.writeText(text).then(() => {
      btnNext.textContent = '✓ Copied!';
      setTimeout(() => { btnNext.textContent = '↻ Retake'; }, 1500);
    }).catch(() => {});
  }
}

// ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
//  BOOT
// ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
renderSlides();
btnNext.onclick = () => {
  if (!btnNext.classList.contains('enabled')) return;
  if (currentSlide < QUESTIONS.length - 1) {
    goToSlide(currentSlide + 1);
  } else {
    showResults();
  }
};
</script>
