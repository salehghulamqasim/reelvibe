<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <title>ReelVibe</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
  <style>
    /* ── Reset & Base ── */
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    html, body {
      height: 100%; overflow: hidden;
      font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
      background: #05050a;
      color: #f1f1f6;
      -webkit-tap-highlight-color: transparent;
      -webkit-font-smoothing: antialiased;
    }

    /* ── Animated BG ── */
    .bg-mesh {
      position: fixed; inset: 0; z-index: 0;
      background:
        radial-gradient(ellipse 80% 60% at 10% 20%, rgba(88,28,200,0.15) 0%, transparent 70%),
        radial-gradient(ellipse 60% 50% at 90% 80%, rgba(139,92,246,0.1) 0%, transparent 60%),
        radial-gradient(ellipse 50% 40% at 50% 50%, rgba(236,72,153,0.06) 0%, transparent 50%);
      animation: bgShift 20s ease-in-out infinite alternate;
    }
    @keyframes bgShift {
      0% { transform: scale(1) rotate(0deg); }
      100% { transform: scale(1.1) rotate(3deg); }
    }
    .bg-noise {
      position: fixed; inset: 0; z-index: 0;
      opacity: 0.03;
      background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 256 256' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='noise'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.9' numOctaves='4' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23noise)'/%3E%3C/svg%3E");
      background-repeat: repeat;
      pointer-events: none;
    }

    /* ── App Shell ── */
    #app {
      position: relative; z-index: 1;
      height: 100dvh; max-width: 480px; margin: 0 auto;
      display: flex; flex-direction: column;
      padding: 0 20px;
    }

    /* ── Header ── */
    .header {
      padding: 48px 0 12px; flex-shrink: 0;
      display: flex; align-items: center; justify-content: space-between;
    }
    .header-brand {
      display: flex; align-items: center; gap: 10px;
      font-size: 20px; font-weight: 800; letter-spacing: -0.5px;
    }
    .header-brand .logo-icon {
      width: 32px; height: 32px;
      background: linear-gradient(135deg, #8b5cf6, #ec4899);
      border-radius: 10px;
      display: flex; align-items: center; justify-content: center;
      font-size: 16px;
    }
    .header-step {
      font-size: 13px; font-weight: 500;
      color: rgba(255,255,255,0.3);
      letter-spacing: 0.5px;
    }
    .header-step span { color: #8b5cf6; }

    /* ── Progress ── */
    .progress-wrap {
      padding: 0 0 20px; flex-shrink: 0;
    }
    .progress-track {
      height: 6px; background: rgba(255,255,255,0.06);
      border-radius: 6px; overflow: hidden;
      position: relative;
    }
    .progress-fill {
      height: 100%; border-radius: 6px;
      width: 0%;
      background: linear-gradient(90deg, #8b5cf6, #ec4899);
      transition: width 0.6s cubic-bezier(0.34, 1.56, 0.64, 1);
      position: relative;
    }
    .progress-fill::after {
      content: ''; position: absolute; right: -4px; top: -2px;
      width: 10px; height: 10px; border-radius: 50%;
      background: #ec4899; opacity: 0.6;
      filter: blur(3px);
    }

    /* ── Slide Container ── */
    .slides-wrap {
      flex: 1; position: relative; overflow: hidden;
      margin: 0 -8px; padding: 0 8px;
    }
    .slide {
      position: absolute; inset: 0;
      display: flex; flex-direction: column; justify-content: center;
      opacity: 0; transform: translateY(24px) scale(0.97);
      transition: all 0.55s cubic-bezier(0.34, 1.56, 0.64, 1);
      pointer-events: none;
    }
    .slide.active {
      opacity: 1; transform: translateY(0) scale(1);
      pointer-events: auto;
    }
    .slide.dismiss {
      opacity: 0; transform: translateY(-24px) scale(0.95);
    }

    /* ── Question ── */
    .q-num {
      font-size: 12px; font-weight: 600;
      color: #8b5cf6; letter-spacing: 2px; text-transform: uppercase;
      margin-bottom: 6px;
    }
    .q-title {
      font-size: 28px; font-weight: 800;
      line-height: 1.15; letter-spacing: -0.5px;
      margin-bottom: 6px;
    }
    .q-sub {
      font-size: 15px; color: rgba(255,255,255,0.4);
      margin-bottom: 28px; font-weight: 400;
    }

    /* ── Options ── */
    .opts {
      display: grid; gap: 10px;
    }
    .opts-2 { grid-template-columns: 1fr 1fr; }
    .opts-3 { grid-template-columns: 1fr 1fr 1fr; }
    .opts-4 { grid-template-columns: 1fr 1fr; }

    .opt {
      background: rgba(255,255,255,0.04);
      border: 1px solid rgba(255,255,255,0.06);
      border-radius: 16px; padding: 18px 10px;
      text-align: center; cursor: pointer;
      transition: all 0.3s cubic-bezier(0.34, 1.56, 0.64, 1);
      display: flex; flex-direction: column; align-items: center; gap: 8px;
      position: relative; overflow: hidden;
      -webkit-tap-highlight-color: transparent;
    }
    .opt::before {
      content: ''; position: absolute; inset: 0;
      border-radius: 16px; opacity: 0;
      background: linear-gradient(135deg, rgba(139,92,246,0.1), rgba(236,72,153,0.05));
      transition: opacity 0.3s ease;
    }
    .opt:active { transform: scale(0.96); }
    .opt .emoji {
      font-size: 32px; line-height: 1;
      position: relative; z-index: 1;
    }
    .opt .lbl {
      font-size: 13px; font-weight: 500;
      color: rgba(255,255,255,0.65);
      position: relative; z-index: 1;
      line-height: 1.2;
    }
    .opt.selected {
      border-color: #8b5cf6;
      background: rgba(139,92,246,0.12);
      box-shadow: 0 0 30px rgba(139,92,246,0.08), inset 0 0 30px rgba(139,92,246,0.03);
    }
    .opt.selected::before { opacity: 1; }
    .opt.selected .lbl { color: #fff; }
    .opt.selected::after {
      content: ''; position: absolute; top: -1px; left: 20%; right: 20%;
      height: 2px; background: linear-gradient(90deg, transparent, #8b5cf6, transparent);
      border-radius: 2px;
    }

    /* ── Full-width option ── */
    .opt-full {
      background: rgba(255,255,255,0.04);
      border: 1px solid rgba(255,255,255,0.06);
      border-radius: 16px; padding: 20px;
      text-align: center; cursor: pointer;
      transition: all 0.3s cubic-bezier(0.34, 1.56, 0.64, 1);
      display: flex; align-items: center; justify-content: center; gap: 10px;
      -webkit-tap-highlight-color: transparent;
    }
    .opt-full:active { transform: scale(0.97); }
    .opt-full .emoji { font-size: 28px; }
    .opt-full .lbl { font-size: 15px; font-weight: 500; color: rgba(255,255,255,0.65); }
    .opt-full.selected {
      border-color: #8b5cf6;
      background: rgba(139,92,246,0.12);
      box-shadow: 0 0 30px rgba(139,92,246,0.08);
    }
    .opt-full.selected .lbl { color: #fff; }

    /* ── Nav ── */
    .nav {
      padding: 16px 0 32px; flex-shrink: 0;
    }
    .btn-pri {
      width: 100%; padding: 18px;
      border: none; border-radius: 14px;
      font-size: 16px; font-weight: 600; font-family: inherit;
      background: linear-gradient(135deg, #8b5cf6, #7c3aed);
      color: #fff; cursor: pointer;
      transition: all 0.3s cubic-bezier(0.34, 1.56, 0.64, 1);
      opacity: 0.25; pointer-events: none;
      position: relative; overflow: hidden;
    }
    .btn-pri.enabled {
      opacity: 1; pointer-events: auto;
    }
    .btn-pri.enabled:hover { transform: translateY(-1px); box-shadow: 0 12px 30px rgba(139,92,246,0.25); }
    .btn-pri:active { transform: scale(0.97); }
    .btn-pri .arrow { display: inline-block; transition: transform 0.3s ease; }
    .btn-pri.enabled:hover .arrow { transform: translateX(4px); }

    /* ── Skip hint ── */
    .skip-hint {
      text-align: center; margin-top: 10px;
      font-size: 13px; color: rgba(255,255,255,0.2);
    }

    /* ── RESULTS ── */
    .results-view {
      height: 100%; display: flex; flex-direction: column;
      padding-top: 8px;
    }
    .results-head {
      display: flex; align-items: center; gap: 12px;
      margin-bottom: 16px; flex-shrink: 0;
    }
    .results-head h2 {
      font-size: 24px; font-weight: 800; letter-spacing: -0.5px;
    }
    .results-head .match-sub {
      font-size: 13px; color: rgba(255,255,255,0.35);
      margin-top: 2px;
    }
    .results-scroll {
      flex: 1; overflow-y: auto;
      -webkit-overflow-scrolling: touch;
      padding: 0 2px 12px;
    }
    .results-scroll::-webkit-scrollbar { width: 3px; }
    .results-scroll::-webkit-scrollbar-thumb { background: rgba(255,255,255,0.08); border-radius: 3px; }

    .r-card {
      background: rgba(255,255,255,0.03);
      border: 1px solid rgba(255,255,255,0.06);
      border-radius: 20px; padding: 20px;
      margin-bottom: 12px;
      position: relative; overflow: hidden;
      cursor: pointer;
      transition: all 0.3s ease;
    }
    .r-card:active { transform: scale(0.98); }
    .r-card::before {
      content: ''; position: absolute; top: 0; left: 0; right: 0;
      height: 3px;
      background: linear-gradient(90deg, #8b5cf6, #ec4899);
      opacity: 0.6;
    }
    .r-card .r-rank {
      font-size: 11px; font-weight: 600;
      color: #8b5cf6; text-transform: uppercase;
      letter-spacing: 1.5px; margin-bottom: 4px;
    }
    .r-card .r-title {
      font-size: 22px; font-weight: 700;
      letter-spacing: -0.3px; margin-bottom: 2px;
    }
    .r-card .r-meta {
      display: flex; align-items: center; gap: 10px;
      font-size: 13px; color: rgba(255,255,255,0.4);
      margin-bottom: 10px;
    }
    .r-card .r-meta .dot { width: 3px; height: 3px; border-radius: 50%; background: rgba(255,255,255,0.2); }
    .r-card .r-match {
      display: inline-flex; align-items: center; gap: 4px;
      font-size: 12px; font-weight: 600; color: #34d399;
      background: rgba(52,211,153,0.1); padding: 2px 10px;
      border-radius: 20px; border: 1px solid rgba(52,211,153,0.15);
    }
    .r-card .r-tags {
      display: flex; flex-wrap: wrap; gap: 6px; margin-top: 10px;
    }
    .r-card .r-tag {
      font-size: 11px; font-weight: 500;
      padding: 4px 10px; border-radius: 20px;
      background: rgba(255,255,255,0.05);
      border: 1px solid rgba(255,255,255,0.06);
      color: rgba(255,255,255,0.5);
    }
    .r-card .r-desc {
      font-size: 14px; color: rgba(255,255,255,0.45);
      margin-top: 10px; line-height: 1.5;
    }
    .r-card .r-actions {
      display: flex; gap: 8px; margin-top: 14px;
    }
    .r-card .r-actions button {
      padding: 8px 14px; border: none; border-radius: 10px;
      font-size: 12px; font-weight: 600; font-family: inherit;
      cursor: pointer; transition: all 0.2s ease;
    }
    .r-card .r-actions button:active { transform: scale(0.95); }
    .r-btn-watchlist {
      background: rgba(139,92,246,0.15);
      color: #a78bfa; border: 1px solid rgba(139,92,246,0.2) !important;
    }
    .r-btn-watchlist.saved { background: rgba(52,211,153,0.15); color: #34d399; border-color: rgba(52,211,153,0.2) !important; }
    .r-btn-watched {
      background: rgba(255,255,255,0.05);
      color: rgba(255,255,255,0.4);
    }
    .r-btn-watched.seen { background: rgba(251,191,36,0.15); color: #fbbf24; }

    /* ── Results Bottom Bar ── */
    .results-bar {
      display: flex; gap: 10px; flex-shrink: 0; padding: 8px 0 16px;
    }
    .results-bar button {
      flex: 1; padding: 14px; border: none; border-radius: 14px;
      font-size: 14px; font-weight: 600; font-family: inherit;
      cursor: pointer; transition: all 0.25s ease;
    }
    .results-bar button:active { transform: scale(0.96); }
    .btn-refine {
      background: rgba(255,255,255,0.05);
      color: rgba(255,255,255,0.6);
      border: 1px solid rgba(255,255,255,0.06);
    }
    .btn-retake {
      background: linear-gradient(135deg, #8b5cf6, #7c3aed);
      color: #fff;
    }
    .btn-share {
      background: rgba(255,255,255,0.08);
      color: #fff;
    }

    /* ── EXPANDED CARD ── */
    .r-card .r-expand {
      max-height: 0; overflow: hidden;
      transition: max-height 0.4s cubic-bezier(0.34, 1.56, 0.64, 1);
    }
    .r-card.expanded .r-expand {
      max-height: 200px;
    }
    .r-expand-inner {
      padding-top: 12px; border-top: 1px solid rgba(255,255,255,0.05);
      margin-top: 12px;
    }
    .r-expand-inner .row {
      display: flex; justify-content: space-between;
      font-size: 13px; padding: 4px 0;
    }
    .r-expand-inner .row .label { color: rgba(255,255,255,0.3); }
    .r-expand-inner .row .value { color: rgba(255,255,255,0.7); font-weight: 500; }

    /* ── SAVED TOAST ── */
    .toast {
      position: fixed; bottom: 30px; left: 50%; transform: translateX(-50%) translateY(80px);
      background: rgba(255,255,255,0.08);
      backdrop-filter: blur(20px); -webkit-backdrop-filter: blur(20px);
      border: 1px solid rgba(255,255,255,0.1);
      border-radius: 14px; padding: 12px 24px;
      font-size: 14px; font-weight: 500; color: #fff;
      opacity: 0; transition: all 0.4s cubic-bezier(0.34, 1.56, 0.64, 1);
      z-index: 100; pointer-events: none;
      white-space: nowrap;
    }
    .toast.show { opacity: 1; transform: translateX(-50%) translateY(0); }

    /* ── WATCHLIST MODAL ── */
    .modal-overlay {
      position: fixed; inset: 0; z-index: 50;
      background: rgba(0,0,0,0.7);
      backdrop-filter: blur(8px); -webkit-backdrop-filter: blur(8px);
      display: flex; align-items: flex-end;
      opacity: 0; pointer-events: none;
      transition: opacity 0.3s ease;
    }
    .modal-overlay.open { opacity: 1; pointer-events: auto; }
    .modal {
      width: 100%; max-width: 480px; margin: 0 auto;
      background: #0d0d18; border-radius: 24px 24px 0 0;
      padding: 24px 20px 40px;
      max-height: 70vh; overflow-y: auto;
      transform: translateY(100%);
      transition: transform 0.4s cubic-bezier(0.34, 1.56, 0.64, 1);
      border-top: 1px solid rgba(255,255,255,0.06);
    }
    .modal-overlay.open .modal { transform: translateY(0); }
    .modal-handle {
      width: 36px; height: 4px; background: rgba(255,255,255,0.15);
      border-radius: 4px; margin: 0 auto 16px;
    }
    .modal h3 { font-size: 20px; font-weight: 700; margin-bottom: 4px; }
    .modal .sub { font-size: 13px; color: rgba(255,255,255,0.4); margin-bottom: 16px; }
    .modal-item {
      display: flex; align-items: center; justify-content: space-between;
      padding: 14px 16px; background: rgba(255,255,255,0.03);
      border-radius: 14px; margin-bottom: 8px;
      border: 1px solid rgba(255,255,255,0.04);
    }
    .modal-item .mi-title { font-weight: 600; font-size: 15px; }
    .modal-item .mi-meta { font-size: 12px; color: rgba(255,255,255,0.35); }
    .modal-item button {
      background: rgba(239,68,68,0.15); border: none;
      color: #ef4444; padding: 6px 14px; border-radius: 8px;
      font-size: 12px; font-weight: 600; cursor: pointer; font-family: inherit;
    }

    /* ── Animations ── */
    @keyframes fadeUp {
      from { opacity: 0; transform: translateY(12px); }
      to { opacity: 1; transform: translateY(0); }
    }
    .anim-in { animation: fadeUp 0.5s ease forwards; opacity: 0; }
    .delay-1 { animation-delay: 0.1s; }
    .delay-2 { animation-delay: 0.2s; }
    .delay-3 { animation-delay: 0.3s; }
    .delay-4 { animation-delay: 0.4s; }

    /* ── Loading ── */
    .load-screen {
      display: flex; flex-direction: column;
      align-items: center; justify-content: center; gap: 20px;
      height: 100%;
    }
    .load-ring {
      width: 48px; height: 48px;
      border: 3px solid rgba(255,255,255,0.05);
      border-top-color: #8b5cf6;
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
    }
    @keyframes spin { to { transform: rotate(360deg); } }
    .load-screen p { font-size: 14px; color: rgba(255,255,255,0.3); }

    /* ── Empty state ── */
    .empty-wl {
      text-align: center; padding: 40px 0;
      color: rgba(255,255,255,0.2); font-size: 14px;
    }
    .empty-wl .big { font-size: 48px; margin-bottom: 12px; }

    /* ── Responsive ── */
    @media (max-width: 380px) {
      .q-title { font-size: 24px; }
      .opt .emoji { font-size: 26px; }
      .opt .lbl { font-size: 12px; }
      .opt { padding: 14px 8px; }
      #app { padding: 0 16px; }
      .header { padding-top: 40px; }
    }
    @media (min-width: 481px) {
      #app { border-left: 1px solid rgba(255,255,255,0.04); border-right: 1px solid rgba(255,255,255,0.04); }
    }
  </style>
</head>
<body>
<div class="bg-mesh"></div>
<div class="bg-noise"></div>

<div id="app">
  <!-- Header -->
  <div class="header">
    <div class="header-brand">
      <div class="logo-icon">🎬</div>
      ReelVibe
    </div>
    <div class="header-step" id="headerStep">Step <span>1</span>/6</div>
  </div>

  <!-- Progress -->
  <div class="progress-wrap">
    <div class="progress-track">
      <div class="progress-fill" id="progressFill"></div>
    </div>
  </div>

  <!-- Slides -->
  <div class="slides-wrap" id="slidesWrap">
    <!-- injected -->
  </div>

  <!-- Nav -->
  <div class="nav" id="navArea">
    <button class="btn-pri" id="btnNext">Next →</button>
    <div class="skip-hint" id="skipHint"></div>
  </div>
</div>

<!-- Toast -->
<div class="toast" id="toast"></div>

<!-- Watchlist Modal -->
<div class="modal-overlay" id="wlModal">
  <div class="modal">
    <div class="modal-handle"></div>
    <h3>📋 Watchlist</h3>
    <div class="sub" id="wlCount">0 saved</div>
    <div id="wlList"></div>
  </div>
</div>

<script>
// ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
//  QUESTIONS
// ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
const Q = [
  {
    id:'mood', label:'Mood', num:'01',
    title:'What\'s your vibe?',
    sub:"Set the energy — we'll match it",
    cols:3, opts:[
      {e:'🔥',l:'Pumped',v:'pumped'},
      {e:'🧠',l:'Thoughtful',v:'thoughtful'},
      {e:'😂',l:'Funny',v:'funny'},
      {e:'😰',l:'Tense',v:'tense'},
      {e:'💔',l:'Emotional',v:'emotional'},
      {e:'🌙',l:'Chill',v:'chill'},
    ]
  },
  {
    id:'genre', label:'Genre', num:'02',
    title:'Pick your territory',
    sub:'Where do you want to escape to?',
    cols:3, opts:[
      {e:'🤖',l:'Sci-Fi',v:'sci-fi'},
      {e:'🔫',l:'Action',v:'action'},
      {e:'😆',l:'Comedy',v:'comedy'},
      {e:'🕵️',l:'Thriller',v:'thriller'},
      {e:'😨',l:'Horror',v:'horror'},
      {e:'💕',l:'Romance',v:'romance'},
      {e:'⚔️',l:'Fantasy',v:'fantasy'},
      {e:'🌑',l:'Dark',v:'dark'},
      {e:'📖',l:'Drama',v:'drama'},
    ]
  },
  {
    id:'type', label:'Format', num:'03',
    title:'Movie or series?',
    sub:'Choose your commitment level',
    cols:3, opts:[
      {e:'🎬',l:'Movie',v:'movie'},
      {e:'📺',l:'Series',v:'series'},
      {e:'🤷',l:'Either',v:'either'},
    ]
  },
  {
    id:'time', label:'Time', num:'04',
    title:'How much time?',
    sub:'Be honest with yourself 😅',
    cols:2, opts:[
      {e:'⏱️',l:'Quick (< 2h)',v:'quick'},
      {e:'🎞️',l:'Standard',v:'standard'},
      {e:'🍿',l:'Binge-ready',v:'binge'},
      {e:'🏰',l:'Epic saga',v:'epic'},
    ]
  },
  {
    id:'era', label:'Era', num:'05',
    title:'Which era hits?',
    sub:'Old gold or fresh drops',
    cols:2, opts:[
      {e:'📼',l:'Classic',v:'classic'},
      {e:'💿',l:'2000s–2010s',v:'2000s'},
      {e:'✨',l:'Recent (2020+)',v:'recent'},
      {e:'♾️',l:'Any era',v:'any'},
    ]
  },
  {
    id:'intensity', label:'Intensity', num:'06',
    title:'How deep?',
    sub:'Light snack or emotional damage?',
    cols:3, opts:[

let curSlide = 0;
const ans = {};
let watchlist = JSON.parse(localStorage.getItem('rv_watchlist') || '[]');
let watched = JSON.parse(localStorage.getItem('rv_watched') || '[]');

// ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
//  DOM refs
// ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
const wrap = document.getElementById('slidesWrap');
const btn = document.getElementById('btnNext');
const fill = document.getElementById('progressFill');
const hStep = document.getElementById('headerStep');
const toast = document.getElementById('toast');
const skipHint = document.getElementById('skipHint');

// ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
//  RENDER
// ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
function render() {
  wrap.innerHTML = Q.map((q,i) => {
    const oc = q.cols===1 ? '' : `opts-${q.cols}`;
    return `<div class="slide ${i===0?'active':''}" data-idx="${i}">
      <div class="q-num">${q.num}. ${q.label}</div>
      <div class="q-title">${q.title}</div>
      <div class="q-sub">${q.sub}</div>
      <div class="opts ${oc}">
        ${q.opts.map(o => `
          <div class="${q.cols===1?'opt-full':'opt'}" data-q="${q.id}" data-val="${o.v}">
            <span class="emoji">${o.e}</span>
            <span class="lbl">${o.l}</span>
          </div>
        `).join('')}
      </div>
    </div>`;
  }).join('');
  updateUI();
}

// ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
//  UI update
// ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
function updateUI() {
  const total = Q.length;
  const pct = Math.round((curSlide/total)*100);
  fill.style.width = pct+'%';
  hStep.innerHTML = `Step <span>${Math.min(curSlide+1,total)}</span>/${total}`;
  if (curSlide < total) {
    const isLast = curSlide === total-1;
    btn.innerHTML = isLast ? 'Get My Picks →' : 'Next →';
    btn.classList.toggle('enabled', !!ans[Q[curSlide]?.id]);
    skipHint.textContent = `Tap an option to continue`;
  }
}

// ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
//  NAV
// ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
function goTo(n) {
  const slides = wrap.querySelectorAll('.slide');
  slides.forEach(s => { s.classList.remove('active','dismiss'); });
  if (n > curSlide) slides[curSlide].classList.add('dismiss');
  slides[n].classList.add('active');
  curSlide = n;
  btn.onclick = null; // reset
  if (curSlide >= Q.length) return;
  updateUI();
  // update listeners
  attachNav();
}

function attachNav() {
  btn.onclick = () => {
    if (!btn.classList.contains('enabled')) return;
    if (curSlide < Q.length-1) goTo(curSlide+1);
    else calcResults();
  };
}

// ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
//  SELECTION
// ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
wrap.addEventListener('click', e => {
  const el = e.target.closest('.opt, .opt-full');
  if (!el) return;
  const qId = el.dataset.q;
  const val = el.dataset.val;
  if (!qId) return;
  const slide = el.closest('.slide');
  slide.querySelectorAll('.opt, .opt-full').forEach(x => x.classList.remove('selected'));
  el.classList.add('selected');
  ans[qId] = val;
  btn.classList.add('enabled');
  // subtle haptic feedback simulation
});

// ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
//  RECOMMENDATION ENGINE
// ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
function score(item) {
  let s = 0;
  if (item.m.includes(ans.mood)) s += 30;
  if (item.g.includes(ans.genre)) s += 28;
  if (ans.type === 'either') s += 10;
  else if (item.ty === ans.type) s += 20;
  if (ans.time === 'quick' && item.tm === 'quick') s += 12;
  else if (ans.time === 'standard' && item.tm === 'standard') s += 12;
  else if (ans.time === 'binge' && (item.tm === 'binge' || item.tm === 'epic')) s += 10;
  else if (ans.time === 'epic' && item.tm === 'epic') s += 12;
  else if (ans.time === 'standard' && item.tm === 'quick') s += 5;
  else if (ans.time === 'binge' && item.tm === 'standard') s += 4;
  if (!ans.era || ans.era === 'any') s += 10;
  else if (item.e === ans.era) s += 10;
  else if ((ans.era === 'classic' || ans.era === '2000s') && (item.e === 'classic' || item.e === '2000s')) s += 6;
  else if ((ans.era === 'recent') && (item.e === 'recent' || item.e === '2010s')) s += 6;
  if (item.i === ans.intensity) s += 6;
  else if (ans.intensity === 'medium' && (item.i === 'light' || item.i === 'heavy')) s += 2;
  if (ans.mood === 'tense' && item.g.includes('dark')) s += 4;
  if (ans.mood === 'chill' && item.g.includes('comedy')) s += 4;
  return s;
}

function recommend() {
  const scored = DB.map(item => ({ ...item, s: score(item) }));
  scored.sort((a,b) => b.s - a.s);
  const seen = new Set();
  const top = [];
  for (const item of scored) {
    const k = item.t.toLowerCase().replace(/[^a-z0-9]/g,'');
    if (!seen.has(k) && !watched.includes(k)) {
      seen.add(k);
      top.push(item);
    }
    if (top.length >= 5) break;
  }
  return top;
}

// ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
//  RESULTS
// ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
function calcResults() {
  // Loading
  wrap.innerHTML = `<div class="slide active"><div class="load-screen">
    <div class="load-ring"></div>
    <p>Reading your vibe...</p>
  </div></div>`;
  btn.classList.remove('enabled');
  btn.textContent = '✨';

  setTimeout(() => {
    showResults(recommend());
  }, 700);
}

function showResults(picks, isRefresh) {
  const rankEm = ['🥇','🥈','🥉','4️⃣','5️⃣'];
  const rankL = ['Top Pick','Second Pick','Third Pick','Fourth','Fifth'];
  const maxS = Math.max(...picks.map(p=>p.s),1);

  wrap.innerHTML = `<div class="slide active"><div class="results-view">
    <div class="results-head">
      <div>
        <h2>${isRefresh ? 'Refreshed 🔄' : 'Your Picks 🎯'}</h2>
        <div class="match-sub">${isRefresh ? 'Tweaked your vibe' : 'Based on your mood, here\'s what hits'}</div>
      </div>
    </div>
    <div class="results-scroll" id="rScroll">
      ${picks.map((item,i) => {
        const pct = Math.round((item.s/maxS)*100);
        const k = item.t.toLowerCase().replace(/[^a-z0-9]/g,'');
        const inWl = watchlist.includes(k);
        const intensityL = item.i === 'light' ? '🌿 Light' : item.i === 'medium' ? '⚡ Medium' : '🌋 Heavy';
        return `<div class="r-card anim-in delay-${Math.min(i+1,4)}" data-key="${k}" onclick="this.classList.toggle('expanded')">
          <div class="r-rank">${rankEm[i]} ${rankL[i]}</div>
          <div class="r-title">${item.t}</div>
          <div class="r-meta">
            <span>${item.y}</span>
            <span class="dot"></span>
            <span>${item.ty === 'movie' ? '🎬 Movie' : '📺 Series'}</span>
            <span class="dot"></span>
            <span>${intensityL}</span>
            <span class="r-match">${pct}% match</span>
          </div>
          <div class="r-tags">
            ${item.g.map(g => `<span class="r-tag">#${g}</span>`).join('')}
            ${item.rt ? `<span class="r-tag">⭐ ${item.rt}</span>` : ''}
          </div>
          <div class="r-desc">${item.d}</div>
          <div class="r-actions">
            <button class="r-btn-watchlist ${inWl?'saved':''}" onclick="event.stopPropagation();toggleWl('${k}','${item.t.replace(/'/g,"\\'")}',this)">${inWl?'✓ Saved':'+ Watchlist'}</button>
            <button class="r-btn-watched" onclick="event.stopPropagation();toggleWatched('${k}',this)">👁️ Watched</button>
          </div>
          <div class="r-expand">
            <div class="r-expand-inner">
              <div class="row"><span class="label">Year</span><span class="value">${item.y}</span></div>
              <div class="row"><span class="label">Rating</span><span class="value">⭐ ${item.rt}/10</span></div>
              <div class="row"><span class="label">Type</span><span class="value">${item.ty === 'movie' ? '🎬 Movie' : '📺 Series'}</span></div>
              <div class="row"><span class="label">Length</span><span class="value">${item.tm === 'quick' ? '⏱️ Quick' : item.tm === 'standard' ? '🎞️ Standard' : item.tm === 'binge' ? '🍿 Binge' : '🏰 Epic'}</span></div>
            </div>
          </div>
        </div>`;
      }).join('')}
    </div>
    <div class="results-bar">
      <button class="btn-refine" onclick="refreshPicks()">🔄 Refine</button>
      <button class="btn-share" onclick="sharePicks()">📤 Share</button>
      <button class="btn-retake" onclick="retake()">↻ Retake</button>
    </div>
  </div></div>`;

  fill.style.width = '100%';
  hStep.innerHTML = '🎉 Done';
  btn.classList.remove('enabled');
  btn.textContent = '📋 Watchlist';
  btn.onclick = openWatchlist;
}

// ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
//  REFINE
// ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
function refreshPicks() {
  wrap.innerHTML = `<div class="slide active"><div class="load-screen">
    <div class="load-ring"></div>
    <p>Finding something different...</p>
  </div></div>`;
  setTimeout(() => {
    // Re-score with randomness
    const picks = recommend();
    // shuffle last few for variety
    if (picks.length > 2) {
      // swap 4th with something random
      const rest = DB.filter(d => !picks.some(p => p.t === d.t));
      if (rest.length > 0) {
        const r = rest[Math.floor(Math.random()*rest.length)];
        picks[picks.length-1] = { ...r, s: score(r) };
      }
    }
    picks.sort((a,b) => b.s - a.s);
    showResults(picks.slice(0,5), true);
  }, 500);
}

// ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
//  WATCHLIST
// ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
function toggleWl(key, title, el) {
  const idx = watchlist.indexOf(key);
  if (idx > -1) {
    watchlist.splice(idx,1);
    if (el) { el.textContent='+ Watchlist'; el.classList.remove('saved'); }
    showToast(`Removed from watchlist`);
  } else {
    watchlist.push(key);
    if (el) { el.textContent='✓ Saved'; el.classList.add('saved'); }
    showToast(`Added to watchlist ✨`);
  }
  localStorage.setItem('rv_watchlist', JSON.stringify(watchlist));
}

function toggleWatched(key, el) {
  const idx = watched.indexOf(key);
  if (idx > -1) {
    watched.splice(idx,1);
    el.classList.remove('seen');
    showToast(`Marked as unwatched`);
  } else {
    watched.push(key);
    el.classList.add('seen');
    el.textContent='✅ Seen';
    showToast(`Marked as watched 👁️`);
    // Remove from watchlist if present
    const wlIdx = watchlist.indexOf(key);
    if (wlIdx > -1) {
      watchlist.splice(wlIdx,1);
      localStorage.setItem('rv_watchlist', JSON.stringify(watchlist));
    }
  }
  localStorage.setItem('rv_watched', JSON.stringify(watched));
}

function openWatchlist() {
  const modal = document.getElementById('wlModal');
  const list = document.getElementById('wlList');
  const count = document.getElementById('wlCount');
  count.textContent = `${watchlist.length} saved`;

  if (watchlist.length === 0) {
    list.innerHTML = `<div class="empty-wl"><div class="big">📭</div>No saves yet<br><span style="font-size:13px;color:rgba(255,255,255,0.2)">Tap + on any recommendation</span></div>`;
  } else {
    list.innerHTML = watchlist.map(k => {
      const item = DB.find(d => d.t.toLowerCase().replace(/[^a-z0-9]/g,'') === k);
      if (!item) return '';
      return `<div class="modal-item">
        <div><div class="mi-title">${item.t}</div><div class="mi-meta">${item.y} · ${item.ty==='movie'?'🎬 Movie':'📺 Series'}</div></div>
        <button onclick="removeWl('${k}')">Remove</button>
      </div>`;
    }).join('');
  }
  modal.classList.add('open');
}

function removeWl(key) {
  const idx = watchlist.indexOf(key);
  if (idx > -1) {
    watchlist.splice(idx, 1);
    localStorage.setItem('rv_watchlist', JSON.stringify(watchlist));
    openWatchlist(); // re-render
    // Also update card buttons
    const btn = document.querySelector(`.r-btn-watchlist[data-key="${key}"]`);
    if (btn) { btn.textContent='+ Watchlist'; btn.classList.remove('saved'); }
    showToast(`Removed from watchlist`);
  }
}

document.getElementById('wlModal').addEventListener('click', e => {
  if (e.target === e.currentTarget) {
    e.currentTarget.classList.remove('open');
  }
});

// ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
//  SHARE
// ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
function sharePicks() {
  const cards = document.querySelectorAll('.r-card');
  const titles = Array.from(cards).map(c => c.querySelector('.r-title').textContent);
  if (!titles.length) return;
  const text = `🎬 My ReelVibe picks:\n\n${titles.map((t,i) => `${['🥇','🥈','🥉','4️⃣','5️⃣'][i]} ${t}`).join('\n')}\n\nFind your vibe →`;
  if (navigator.share) {
    navigator.share({ title:'ReelVibe Picks', text }).catch(()=>{});
  } else {
    navigator.clipboard.writeText(text).then(() => {
      showToast('Copied to clipboard 📋');
    }).catch(()=>{});
  }
}

// ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
//  RETake
// ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
function retake() {
  Object.keys(ans).forEach(k => delete ans[k]);
  curSlide = 0;
  render();
  attachNav();
  btn.onclick = null;
  btn.textContent = 'Next →';
  btn.classList.remove('enabled');
  fill.style.width = '0%';
  hStep.innerHTML = 'Step <span>1</span>/6';
  skipHint.textContent = 'Tap an option to continue';
  // Re-attach
  attachNav();
}

// ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
//  TOAST
// ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
let toastTimer;
function showToast(msg) {
  toast.textContent = msg;
  toast.classList.add('show');
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => toast.classList.remove('show'), 2000);
}

// ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
//  BOOT
// ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
render();
attachNav();
</script>
